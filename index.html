  <script>
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }
      playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.1) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }
      playSelect() { this.playTone(520, 'sine', 0.08, 0.08); }
      playLockIn() { this.playTone(330, 'triangle', 0.15, 0.12); }
      playWrong() {
        if (this.muted) return;
        this.playTone(180, 'sawtooth', 0.25, 0.12);
        setTimeout(() => this.playTone(140, 'sawtooth', 0.3, 0.12), 150);
      }
      playWin() {
        if (this.muted) return;
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((n, i) => {
          setTimeout(() => this.playTone(n, 'triangle', 0.3, 0.15), i * 120);
        });
      }
    }
    const sounds = new SoundManager();
  </script>

    function getCityForCountry(feature) {
      const p = feature.properties || {};
      const iso3 = p.ISO_A3 || p.iso_a3 || p.ADM0_A3 || p.WB_A3 || "UNK";
      const cName = getFeatureName(feature);

      if (CITIES_DATABASE[iso3] && CITIES_DATABASE[iso3].length > 0) {
        const list = CITIES_DATABASE[iso3];
        return list[Math.floor(Math.random() * list.length)];
      }

      const matchKey = Object.keys(CITIES_DATABASE).find(key => key.toLowerCase() === cName.toLowerCase());
      if (matchKey && CITIES_DATABASE[matchKey].length > 0) {
        const list = CITIES_DATABASE[matchKey];
        return list[Math.floor(Math.random() * list.length)];
      }

      const meta = extractCountryMeta(feature);
      const centroid = getFeatureCentroid(feature);
      return {
        name: meta.capital || "Capital City",
        lat: centroid.lat,
        lng: centroid.lng
      };
    }

    function getFlagEmoji(iso2) {
      if (!iso2 || iso2.length !== 2 || iso2 === '-9') return '🚩';
      try {
        return String.fromCodePoint(...iso2.toUpperCase().split('').map(c => 127397 + c.charCodeAt(0)));
      } catch(e) {
        return '🚩';
      }
    }

    function getPopTier(pop) {
      if (!pop || pop <= 0) return "< 5 Million";
      if (pop > 1000000000) return "> 1 Billion";
      if (pop > 300000000) return "300M - 1 Billion";
      if (pop > 100000000) return "100M - 300M";
      if (pop > 50000000) return "50M - 100M";
      if (pop > 10000000) return "10M - 50M";
      return "< 10 Million";
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    function getFeatureCentroid(feature) {
      const p = feature.properties || {};
      if (p.LABEL_Y !== undefined && p.LABEL_X !== undefined && p.LABEL_Y !== 0) {
        return { lat: Number(p.LABEL_Y), lng: Number(p.LABEL_X) };
      }
      if (p.LAT !== undefined && p.LON !== undefined && p.LAT !== 0) {
        return { lat: Number(p.LAT), lng: Number(p.LON) };
      }
      
      let sumLat = 0, sumLng = 0, count = 0;
      let polygons = [];
      const geom = feature.geometry;
      if (geom.type === 'Polygon') polygons = [geom.coordinates];
      else if (geom.type === 'MultiPolygon') polygons = geom.coordinates;

      polygons.forEach(poly => {
        poly[0].forEach(pt => {
          sumLng += pt[0];
          sumLat += pt[1];
          count++;
        });
      });

      if (count > 0) {
        return { lat: sumLat / count, lng: sumLng / count };
      }
      return { lat: 0, lng: 0 };
    }

    // Helper: Calculate bounding box span of main landmass to frame the whole country
    function getFeatureBounds(feature) {
      let polygons = [];
      const geom = feature ? feature.geometry : null;
      if (!geom) return { deltaLat: 10, deltaLng: 10 };
      if (geom.type === 'Polygon') polygons = [geom.coordinates];
      else if (geom.type === 'MultiPolygon') polygons = geom.coordinates;

      if (polygons.length === 0) return { deltaLat: 10, deltaLng: 10 };

      // Find the main landmass polygon (ring with the most vertices)
      let mainPoly = polygons[0];
      for (let i = 1; i < polygons.length; i++) {
        if (polygons[i][0] && mainPoly[0] && polygons[i][0].length > mainPoly[0].length) {
          mainPoly = polygons[i];
        }
      }

      let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
      if (mainPoly && mainPoly[0]) {
        mainPoly[0].forEach(pt => {
          const lng = pt[0];
          const lat = pt[1];
          if (lat < minLat) minLat = lat;
          if (lat > maxLat) maxLat = lat;
          if (lng < minLng) minLng = lng;
          if (lng > maxLng) maxLng = lng;
        });
      }

      const deltaLat = Math.abs(maxLat - minLat);
      const deltaLng = Math.abs(maxLng - minLng);
      return { minLat, maxLat, minLng, maxLng, deltaLat, deltaLng };
    }

      }
    }

    function extractCountryMeta(feature) {
      const p = feature.properties || {};
      const cName = getFeatureName(feature);
      
      let iso3 = p.ISO_A3 || p.iso_a3 || p.ADM0_A3 || p.WB_A3 || "UNK";
      let iso2 = p.ISO_A2 || p.iso_a2 || p.POSTAL || p.WB_A2;
      
      const isoFixes = {
        "France": "FR", "Norway": "NO", "Somaliland": "SO", "Kosovo": "XK", 
        "Northern Cyprus": "CY", "Western Sahara": "EH"
      };
      if (isoFixes[cName]) iso2 = isoFixes[cName];
      if (!iso2 || iso2 === '-99' || iso2.length !== 2) iso2 = iso3.slice(0, 2);

      const fallback = COUNTRY_METADATA_FALLBACK[iso3] || {};
      
      const lat = p.LABEL_Y !== undefined ? p.LABEL_Y : (p.LAT || 0);
      const lon = p.LABEL_X !== undefined ? p.LABEL_X : (p.LON || 0);
      const latText = lat >= 0 ? "Northern" : "Southern";
      const lonText = lon >= 0 ? "Eastern" : "Western";
      const hemi = `${latText} & ${lonText}`;

      const drive = LEFT_DRIVE_ISO.has(iso2.toUpperCase()) ? "Left" : "Right";
      const tld = "." + iso2.toLowerCase();
      const flag = getFlagEmoji(iso2);
      const capName = p.CAPITAL || p.CAP_NAME || fallback.capital || "Major City";

      const colorOptions = ["Red", "Blue", "Green", "Yellow", "White"];
      const charSum = cName.split('').reduce((sum, char) => sum + char.charCodeAt(0), 0);
      const fallbackColor = colorOptions[charSum % colorOptions.length];

      return {
        name: cName,
        nameLength: cName.length,
        capital: capName,
        capitalLetter: capName[0].toUpperCase(),
        continent: p.CONTINENT || p.REGION_UN || fallback.continent || "Global",
        subregion: p.SUBREGION || p.REGION_WB || p.CONTINENT || "Global",
        hemisphere: hemi,
        coast: fallback.coast || (p.TINY > 0 ? "Island Nation" : "Coastal / Continental"),
        popTier: getPopTier(p.POP_EST),
        drive: drive,
        tld: tld,
        mainColor: fallback.mainColor || fallbackColor,
        flag: flag,
        letter: cName[0].toUpperCase()
      };
    }

        { title: "Capital Initial", icon: "fa-city", text: `Capital Initial: <strong class="text-amber-400 font-extrabold">'${meta.capitalLetter}'</strong>` },
        { title: "Country Initial", icon: "fa-arrow-down-a-z", text: `Country Initial: <strong class="text-amber-400 font-extrabold">'${meta.letter}'</strong>` }
      ];

      const tier4Pool = [
        { title: "Continent", icon: "fa-globe", text: `Continent: <strong class="text-white font-bold">${meta.continent}</strong>` },
        { title: "Capital City", icon: "fa-building-columns", text: `Capital City: <strong class="text-amber-300 font-bold">${meta.capital}</strong>` },
        { title: "Flag Emoji", icon: "fa-flag", text: `Flag: <span class="text-base">${meta.flag}</span>` }
      ];

      const getRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

      const clue1 = getRandom(tier1Pool);
      const clue2 = getRandom(tier2Pool);
      const clue3 = getRandom(tier3Pool);
      const clue4 = getRandom(tier4Pool);

      const includeShape = Math.random() < 0.5;
      let clue5;

      if (includeShape) {
        clue5 = { title: "Shape Outline", icon: "fa-draw-polygon", isSilhouette: true };
      } else {
        const remainingTier4 = tier4Pool.filter(c => c.title !== clue4.title);
        clue5 = getRandom(remainingTier4);
      }

      return [
        { num: 1, ...clue1, slotId: 'clue-slot-1' },
        { num: 2, ...clue2, slotId: 'clue-slot-2' },
        { num: 3, ...clue3, slotId: 'clue-slot-3' },
        { num: 4, ...clue4, slotId: 'clue-slot-4' },
        { num: 5, ...clue5, slotId: 'clue-slot-5' }
      ];
    }

    function drawSilhouette(canvas, feature) {
      if (!canvas || !feature || !feature.geometry) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      let polygons = [];
      const geom = feature.geometry;
      if (geom.type === 'Polygon') polygons = [geom.coordinates];
      else if (geom.type === 'MultiPolygon') polygons = geom.coordinates;
      
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      polygons.forEach(poly => {
        poly[0].forEach(pt => {
          if (pt[0] < minX) minX = pt[0];
          if (pt[0] > maxX) maxX = pt[0];
          if (pt[1] < minY) minY = pt[1];
          if (pt[1] > maxY) maxY = pt[1];
        });
      });
      
      const w = maxX - minX || 1;
      const h = maxY - minY || 1;
      const padding = 6;
      const scale = Math.min((canvas.width - padding * 2) / w, (canvas.height - padding * 2) / h);
      
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      polygons.forEach(poly => {
        poly.forEach(ring => {
          ring.forEach((pt, i) => {
            const x = padding + (pt[0] - minX) * scale;
            const y = canvas.height - (padding + (pt[1] - minY) * scale);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
        });
      });
      ctx.fill();
    }

    function triggerLossCascade() {
      cascadingRedSet.clear();
      let index = 0;
      if (redCascadeInterval) clearInterval(redCascadeInterval);
      
      redCascadeInterval = setInterval(() => {
        if (index >= geoData.length) {
          clearInterval(redCascadeInterval);
          return;
        }
        for (let b = 0; b < 6 && index < geoData.length; b++, index++) {
          cascadingRedSet.add(geoData[index]);
        }
        if (worldGlobe) worldGlobe.polygonsData(geoData);
      }, 30);
    }

    function startNewRound() {
      if (!geoData.length) return;
      if (redCascadeInterval) clearInterval(redCascadeInterval);
      cascadingRedSet.clear();
      wrongGuesses.clear();
      hotColdMap.clear();
      hotColdHistory = [];
      hotColdGuessesCount = 0;
      selectedFeature = null;
      currentClueIndex = 1;
      gameOver = false;
      gameWon = false;

      cityStep = 'select_country';
      placedPin = null;
      targetCity = null;

      if (worldGlobe) {
        worldGlobe.htmlElementsData([]);
        worldGlobe.arcsData([]);
      }

      const randIdx = Math.floor(Math.random() * geoData.length);
      targetCountryFeature = geoData[randIdx];
      targetMeta = extractCountryMeta(targetCountryFeature);

      currentRoundClues = generateRoundClues(targetMeta);

      const lockBox = document.getElementById('lock-container');
      const btnLock = document.getElementById('btn-lock-guess');
      if (lockBox) {
        lockBox.style.display = 'none';
        lockBox.classList.remove('scale-100', 'opacity-100');
        lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
      }
      if (btnLock) {
        btnLock.style.pointerEvents = 'none';
      }

      const playAnotherBox = document.getElementById('play-another-container');
      const btnPlayAnother = document.getElementById('btn-play-another');
      if (playAnotherBox) {
        playAnotherBox.style.display = 'none';
        playAnotherBox.classList.remove('scale-100', 'opacity-100');
        playAnotherBox.classList.add('hidden', 'scale-90', 'opacity-0');
      }
      if (btnPlayAnother) {
        btnPlayAnother.style.pointerEvents = 'none';
      }

      renderLegend();
      if (gameMode === 'guesser') {
        renderGuesserSidebar();
      } else if (gameMode === 'hotcold') {
        renderHotColdSidebar();
      } else {
        renderCitySidebar();
      }

      if (worldGlobe) {
        worldGlobe.polygonsData(geoData);
        worldGlobe.pointOfView({ lat: 20, lng: 0, altitude: 2.2 }, 1200);
      }
    }

    // Toast Feedback Banner Trigger
    function showFeedbackToast(message, type = 'info') {
      const toast = document.getElementById('feedback-toast');
      const content = document.getElementById('feedback-toast-content');
      if (!toast || !content) return;

      let borderClass = 'border-slate-700 text-slate-200';
      if (type === 'wrong') borderClass = 'border-red-500/60 text-red-300';
      if (type === 'hot') borderClass = 'border-orange-500/60 text-orange-300';
      if (type === 'cold') borderClass = 'border-blue-500/60 text-blue-300';
      if (type === 'win') borderClass = 'border-emerald-500/60 text-emerald-300';

      content.className = `glass-panel px-4 py-2 rounded-full text-xs font-bold shadow-2xl flex items-center space-x-2 border ${borderClass}`;
      content.innerHTML = message;

      toast.style.display = 'flex';
      toast.classList.remove('hidden', '-translate-y-4', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('hidden', '-translate-y-4', 'opacity-0');
        toast.style.display = 'none';
      }, 3200);
    }

    async function ensureGlobeLoaded() {
      const getGlobe = () => {
        if (typeof Globe === 'function') return Globe;
        if (typeof window.Globe === 'function') return window.Globe;
        if (window.Globe && typeof window.Globe.default === 'function') return window.Globe.default;
        return null;
      };

      const existing = getGlobe();
      if (existing) return existing;

      const cdns = [
        'https://cdn.jsdelivr.net/npm/globe.gl',
        'https://unpkg.com/globe.gl'
      ];

      for (const src of cdns) {
        try {
          await new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = src;
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
          });
          const g = getGlobe();
          if (g) return g;
        } catch(e) {}
      }
      throw new Error('Globe.gl library could not be loaded.');
    }

    async function fetchGeoJson() {
      const urls = [
        'https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson',
        'https://cdn.jsdelivr.net/gh/vasturiano/globe.gl/example/datasets/ne_110m_admin_0_countries.geojson'
      ];

      for (const url of urls) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (data && data.features) return data.features;
          }
        } catch(e) {}
      }
      throw new Error('Could not fetch country GeoJSON dataset.');
    }

    async function initApp() {
      const globeDiv = document.getElementById('globe-container');

      try {
        const GlobeConstructor = await ensureGlobeLoaded();
        const features = await fetchGeoJson();

        geoData = features.filter(f => f.properties && f.properties.NAME !== 'Antarctica');

        const getDimensions = () => {
          const rect = globeDiv.getBoundingClientRect();
          return {
            w: rect.width || globeDiv.clientWidth || window.innerWidth,
            h: rect.height || globeDiv.clientHeight || window.innerHeight
          };
        };
        const { w, h } = getDimensions();

        // Create embedded ocean texture so globe rendering never depends on external image assets
        const oceanTexture = (() => {
          const canvas = document.createElement('canvas');
          canvas.width = 1024;
          canvas.height = 512;
          const ctx = canvas.getContext('2d');
          const grad = ctx.createLinearGradient(0, 0, 0, 512);
          grad.addColorStop(0, '#090d16');
          grad.addColorStop(0.5, '#111827');
          grad.addColorStop(1, '#090d16');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 1024, 512);
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.15)';
          ctx.lineWidth = 1;
          for (let x = 0; x < 1024; x += 64) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
          }
          for (let y = 0; y < 512; y += 64) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
          }
          return canvas.toDataURL();
        })();

        worldGlobe = GlobeConstructor()(globeDiv)
          .width(w)
          .height(h)
          .globeImageUrl(oceanTexture)
          .backgroundColor('rgba(0,0,0,0)')
          .showAtmosphere(true)
          .atmosphereColor('#38bdf8')
          .atmosphereAltitude(0.22)
          .polygonsData(geoData)
          .polygonCapColor(d => {
            if (gameOver && d === targetCountryFeature) {
              return gameWon ? 'rgba(16, 185, 129, 0.95)' : 'rgba(59, 130, 246, 0.95)';
            }
            if (gameOver && cascadingRedSet.has(d)) return 'rgba(239, 68, 68, 0.9)';
            if (d === selectedFeature) return 'rgba(245, 158, 11, 0.95)';

            if (gameMode === 'city') {
              if (d === targetCountryFeature) return 'rgba(16, 185, 129, 0.35)';
              return 'rgba(30, 41, 59, 0.85)';
            }

            if (gameMode === 'hotcold') {
              if (hotColdMap.has(d)) {
                return hotColdMap.get(d).rgba;
              }
            } else {
              if (wrongGuesses.has(d)) return 'rgba(239, 68, 68, 0.85)';
            }
            return 'rgba(30, 41, 59, 0.85)';
          })
          .polygonSideColor(() => 'rgba(15, 23, 42, 0.7)')
          .polygonStrokeColor(() => 'rgba(148, 163, 184, 0.45)')
          .polygonAltitude(d => {
            if (gameMode === 'city') {
              if (d === targetCountryFeature) return 0.008;
              return 0.008;
            }
            if (d === selectedFeature) return 0.03;
            if (gameOver && d === targetCountryFeature) return 0.035;
            if (gameMode === 'hotcold' && hotColdMap.has(d)) return 0.02;
            return 0.008;
          })
          .htmlElementsData([])
          .htmlLat(d => d.lat)
          .htmlLng(d => d.lng)
          .htmlAltitude(d => d.altitude !== undefined ? d.altitude : 0.0082)
          .htmlElement(d => {
            const el = document.createElement('div');
            el.setAttribute('style', 'pointer-events: none !important; transform: translate(0, -50%); width: 24px; height: 32px; display: flex; justify-content: center;');
            el.innerHTML = d.html;
            return el;
          })
          .onPolygonClick((feature, event, coords) => {
            if (gameMode === 'city' && cityStep === 'pinpoint') {
              if (coords) {
                handleCityPinClick(coords.lat, coords.lng);
              }
              return;
            }
            if (feature) selectCountryAndRotate(feature, false);
          })
          .onGlobeClick((coords) => {
            if (gameMode === 'city' && cityStep === 'pinpoint' && coords) {
              handleCityPinClick(coords.lat, coords.lng);
            }
          });

        worldGlobe.controls().autoRotate = false;
        worldGlobe.controls().enableZoom = true;
        worldGlobe.pointOfView({ lat: 20, lng: 0, altitude: 2.2 });

        const resizeGlobe = () => {
          if (worldGlobe && globeDiv) {
            const dims = getDimensions();
            if (dims.w > 0 && dims.h > 0) {
              worldGlobe.width(dims.w);
              worldGlobe.height(dims.h);
            }
          }
        };

        if (window.ResizeObserver) {
          const ro = new ResizeObserver(() => resizeGlobe());
          ro.observe(globeDiv);
        }

        setTimeout(resizeGlobe, 100);
        setTimeout(resizeGlobe, 500);

        const loader = document.getElementById('loader');
        if (loader) {
          loader.style.display = 'none';
          loader.style.pointerEvents = 'none';
          loader.classList.add('hidden');
        }

        startNewRound();
      } catch(err) {
        console.error("Failed to initialize GeoSphere globe", err);
        const loader = document.getElementById('loader');
        if (loader) {
          loader.style.display = 'flex';
          loader.innerHTML = `
            <div class="text-red-400 font-bold">Failed to load world map data.</div>
            <button onclick="location.reload()" class="px-4 py-2 bg-slate-800 text-white text-xs rounded-xl mt-3 border border-slate-700 hover:bg-slate-700">Retry</button>
          `;
        }
      }

      const btnLock = document.getElementById('btn-lock-guess');
      if (btnLock) {
        btnLock.addEventListener('click', (e) => {
          if (e) e.stopPropagation();
          if (gameOver) return;

          const revealPlayAnother = () => {
            const playAnotherBox = document.getElementById('play-another-container');
            const btnPlayAnother = document.getElementById('btn-play-another');
            if (playAnotherBox && btnPlayAnother) {
              btnPlayAnother.style.pointerEvents = 'none';
              playAnotherBox.style.display = 'flex';
              playAnotherBox.classList.remove('hidden', 'scale-90', 'opacity-0');
              playAnotherBox.classList.add('scale-100', 'opacity-100');
              setTimeout(() => {
                btnPlayAnother.style.pointerEvents = 'auto';
              }, 400);
            }
          };

          if (gameMode === 'city') {
            if (cityStep === 'select_country') {
              if (!selectedFeature) return;
              targetCountryFeature = selectedFeature;
              const countryName = getFeatureName(targetCountryFeature);
              targetCity = getCityForCountry(targetCountryFeature);
              cityStep = 'pinpoint';
              selectedFeature = null;

              sounds.playLockIn();
              const centroid = getFeatureCentroid(targetCountryFeature);
              const bounds = getFeatureBounds(targetCountryFeature);
              const maxSpan = Math.max(bounds.deltaLat, bounds.deltaLng);
              const targetAltitude = Math.max(0.12, Math.min(0.75, maxSpan * 0.016 + 0.08));

              if (worldGlobe) {
                worldGlobe.polygonsData(geoData);
                worldGlobe.pointOfView({ lat: centroid.lat, lng: centroid.lng, altitude: targetAltitude }, 1400);
              }

              const lockBox = document.getElementById('lock-container');
              if (lockBox) {
                lockBox.style.display = 'none';
                lockBox.classList.remove('scale-100', 'opacity-100');
                lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
              }

              renderCitySidebar();
              showFeedbackToast(`🔍 Zoomed into ${countryName}! Pinpoint <strong>${targetCity.name}</strong>!`, 'info');
              return;
            }

            if (cityStep === 'pinpoint') {
              if (!placedPin || !targetCity) return;
              cityStep = 'result';
              gameOver = true;
              gameWon = true;

              const countryName = getFeatureName(targetCountryFeature);
              const dist = getDistanceKm(placedPin.lat, placedPin.lng, targetCity.lat, targetCity.lng);

              if (dist < 100) {
                sounds.playWin();
                if (window.confetti) confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
              } else {
                sounds.playLockIn();
              }

              if (worldGlobe) {
                worldGlobe.htmlElementsData([
                  {
                    lat: placedPin.lat,
                    lng: placedPin.lng,
                    altitude: 0.008,
                    html: `<div style="transform: translate(0, -50%); width: 24px; height: 32px; pointer-events: none; display: flex; justify-content: center;">
                             <svg width="24" height="32" viewBox="0 0 24 32" fill="none" style="filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.8)); pointer-events: none;">
                               <path d="M12 32 C12 32 24 20 24 12 C24 5.37 18.63 0 12 0 C5.37 0 0 5.37 0 12 C0 20 12 32 12 32 Z M12 7 C14.76 7 17 9.24 17 12 C17 14.76 14.76 17 12 17 C9.24 17 7 14.76 7 12 C7 9.24 9.24 7 12 7 Z" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
                             </svg>
                           </div>`
                  },
                  {
                    lat: targetCity.lat,
                    lng: targetCity.lng,
                    altitude: 0.008,
                    html: `<div style="transform: translate(0, -50%); width: 24px; height: 32px; pointer-events: none; display: flex; justify-content: center;">
                             <svg width="24" height="32" viewBox="0 0 24 32" fill="none" style="filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.8)); pointer-events: none;">
                               <path d="M12 32 C12 32 24 20 24 12 C24 5.37 18.63 0 12 0 C5.37 0 0 5.37 0 12 C0 20 12 32 12 32 Z M12 7 C14.76 7 17 9.24 17 12 C17 14.76 14.76 17 12 17 C9.24 17 7 14.76 7 12 C7 9.24 9.24 7 12 7 Z" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
                             </svg>
                           </div>`
                  }
                ]);

                worldGlobe.arcsData([]);
              }

              const lockBox = document.getElementById('lock-container');
              if (lockBox) {
                lockBox.style.display = 'none';
                lockBox.classList.remove('scale-100', 'opacity-100');
                lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
              }

              const winTextContainer = document.getElementById('win-text-container');
              if (winTextContainer) {
                winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-emerald-400 border border-emerald-500/50 shadow-2xl flex items-center space-x-2";
                winTextContainer.innerHTML = `<span>🎯 <strong>${targetCity.name}</strong> (${countryName}) is ${dist.toLocaleString()} km away!</span>`;
              }

              renderCitySidebar(dist);
              revealPlayAnother();
              return;
            }
          }

          if (!selectedFeature) return;

          const selName = getFeatureName(selectedFeature);
          const targetName = getFeatureName(targetCountryFeature);
          const isCorrect = (selectedFeature === targetCountryFeature) || 
            (selName !== "Unknown Country" && targetName !== "Unknown Country" && selName.toLowerCase() === targetName.toLowerCase());

          if (isCorrect) {
            gameOver = true;
            gameWon = true;
            sounds.playWin();
            showFeedbackToast(`🎉 Correct! ${targetName} is the mystery country!`, 'win');

            if (gameMode === 'guesser') {
              currentClueIndex = 5;
              renderGuesserSidebar();
            } else {
              hotColdGuessesCount++;
              const selCenter = getFeatureCentroid(selectedFeature);
              const targetCenter = getFeatureCentroid(targetCountryFeature);
              const dist = getDistanceKm(selCenter.lat, selCenter.lng, targetCenter.lat, targetCenter.lng);
              const tempInfo = { name: "Correct!", icon: "fa-bullseye", textColor: "text-emerald-400", borderColor: "border-emerald-500/50", rgba: "rgba(16, 185, 129, 0.95)" };
              hotColdMap.set(selectedFeature, tempInfo);
              hotColdHistory.unshift({ name: selName, dist, tempInfo });
              renderHotColdSidebar();
            }

            worldGlobe.polygonsData(geoData);

            if (window.confetti) {
              confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }

            const lockBox = document.getElementById('lock-container');
            if (lockBox) {
              lockBox.style.display = 'none';
              lockBox.classList.remove('scale-100', 'opacity-100');
              lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
            }

            const winNameEl = document.getElementById('win-country-name');
            if (winNameEl) winNameEl.textContent = targetName;

            const winTextContainer = document.getElementById('win-text-container');
            if (winTextContainer) {
              winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-emerald-400 border border-emerald-500/50 shadow-2xl flex items-center space-x-2";
              winTextContainer.innerHTML = `<span>🎉 Correct! It's <span class="underline font-bold">${targetName}</span>!</span>`;
            }

            revealPlayAnother();

          } else {
            if (gameMode === 'guesser') {
              sounds.playWrong();
              wrongGuesses.add(selectedFeature);
              selectedFeature = null;

              const lockBox = document.getElementById('lock-container');
              if (lockBox) {
                lockBox.style.display = 'none';
                lockBox.classList.remove('scale-100', 'opacity-100');
                lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
              }

              if (currentClueIndex < 5) {
                currentClueIndex++;
                showFeedbackToast(`❌ Incorrect! ${selName} is wrong. Clue #${currentClueIndex} unlocked!`, 'wrong');
                renderGuesserSidebar();
                worldGlobe.polygonsData(geoData);
              } else {
                gameOver = true;
                gameWon = false;
                triggerLossCascade();

                if (worldGlobe && targetCountryFeature) {
                  const center = getFeatureCentroid(targetCountryFeature);
                  worldGlobe.pointOfView({ lat: center.lat, lng: center.lng, altitude: 1.6 }, 1200);
                }

                const winTextContainer = document.getElementById('win-text-container');
                if (winTextContainer) {
                  winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-red-400 border border-red-500/50 shadow-2xl flex items-center space-x-2";
                  winTextContainer.innerHTML = `<span>❌ Out of clues! It was <span class="underline font-bold">${targetName}</span></span>`;
                }

                revealPlayAnother();
              }
            } else {
              sounds.playLockIn();
              const selCenter = getFeatureCentroid(selectedFeature);
              const targetCenter = getFeatureCentroid(targetCountryFeature);
              const dist = getDistanceKm(selCenter.lat, selCenter.lng, targetCenter.lat, targetCenter.lng);
              const tempInfo = getTemperatureInfo(dist);

              hotColdMap.set(selectedFeature, tempInfo);
              hotColdHistory.unshift({ name: selName, dist, tempInfo });
              hotColdGuessesCount++;

              selectedFeature = null;

              const lockBox = document.getElementById('lock-container');
              if (lockBox) {
                lockBox.style.display = 'none';
                lockBox.classList.remove('scale-100', 'opacity-100');
                lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
              }

              if (hotColdGuessesCount >= MAX_HOTCOLD_GUESSES) {
                gameOver = true;
                gameWon = false;
                sounds.playWrong();
                renderHotColdSidebar();
                triggerLossCascade();

                if (worldGlobe && targetCountryFeature) {
                  const center = getFeatureCentroid(targetCountryFeature);
                  worldGlobe.pointOfView({ lat: center.lat, lng: center.lng, altitude: 1.6 }, 1200);
                }

                const winTextContainer = document.getElementById('win-text-container');
                if (winTextContainer) {
                  winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-red-400 border border-red-500/50 shadow-2xl flex items-center space-x-2";
                  winTextContainer.innerHTML = `<span>❌ Out of 10 guesses! It was <span class="underline font-bold">${targetName}</span></span>`;
                }

                revealPlayAnother();
              } else {
                const toastType = dist < 2500 ? 'hot' : (dist < 5000 ? 'info' : 'cold');
                showFeedbackToast(`<i class="fa-solid ${tempInfo.icon}"></i> ${tempInfo.name}! ${selName} is ${dist.toLocaleString()} km away. (${MAX_HOTCOLD_GUESSES - hotColdGuessesCount} guesses left)`, toastType);
                renderHotColdSidebar();
                worldGlobe.polygonsData(geoData);
              }
            }
          }
        });
      }

      const modeBtn = document.getElementById('mode-dropdown-btn');
      const modeMenu = document.getElementById('mode-menu');
      const modeBadge = document.getElementById('current-mode-badge');
      const btnGuesser = document.getElementById('mode-guesser');
      const btnHotCold = document.getElementById('mode-hotcold');
      const btnCity = document.getElementById('mode-city');

      if (modeBtn && modeMenu) {
        modeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          modeMenu.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
          if (!modeBtn.contains(e.target) && !modeMenu.contains(e.target)) {
            modeMenu.classList.add('hidden');
          }
        });

        if (btnGuesser && btnHotCold && btnCity) {
          btnGuesser.addEventListener('click', () => {
            if (gameMode === 'guesser') { modeMenu.classList.add('hidden'); return; }
            gameMode = 'guesser';
            if (modeBadge) modeBadge.textContent = 'Country Guesser';
            btnGuesser.className = "w-full text-left px-2.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 hover:bg-slate-800/80 transition text-amber-300 bg-slate-800/50";
            btnHotCold.className = "w-full text-left px-2.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 hover:bg-slate-800/80 transition text-slate-300 mt-1";
            btnCity.className = "w-full text-left px-2.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 hover:bg-slate-800/80 transition text-slate-300 mt-1";
            modeMenu.classList.add('hidden');
            startNewRound();
          });

          btnHotCold.addEventListener('click', () => {
            if (gameMode === 'hotcold') { modeMenu.classList.add('hidden'); return; }
            gameMode = 'hotcold';
            if (modeBadge) modeBadge.textContent = 'Hot or Cold';
            btnHotCold.className = "w-full text-left px-2.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 hover:bg-slate-800/80 transition text-amber-300 bg-slate-800/50 mt-1";
            btnGuesser.className = "w-full text-left px-2.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 hover:bg-slate-800/80 transition text-slate-300";
            btnCity.className = "w-full text-left px-2.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 hover:bg-slate-800/80 transition text-slate-300 mt-1";
            modeMenu.classList.add('hidden');
            startNewRound();
          });

          btnCity.addEventListener('click', () => {
            if (gameMode === 'city') { modeMenu.classList.add('hidden'); return; }
            gameMode = 'city';
            if (modeBadge) modeBadge.textContent = 'City Guesser';
            btnCity.className = "w-full text-left px-2.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 hover:bg-slate-800/80 transition text-amber-300 bg-slate-800/50 mt-1";
            btnGuesser.className = "w-full text-left px-2.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 hover:bg-slate-800/80 transition text-slate-300";
            btnHotCold.className = "w-full text-left px-2.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 hover:bg-slate-800/80 transition text-slate-300 mt-1";
            modeMenu.classList.add('hidden');
            startNewRound();
          });
        }
      }

      const btnPlayAnother = document.getElementById('btn-play-another');
      if (btnPlayAnother) {
        btnPlayAnother.addEventListener('click', (e) => {
          if (e) e.stopPropagation();
          startNewRound();
        });
      }

      const searchInput = document.getElementById('search-country-input');
      const searchResults = document.getElementById('search-results');
      const clearSearchBtn = document.getElementById('btn-clear-search');

      if (searchInput && searchResults) {
        searchInput.addEventListener('input', (e) => {
          const val = e.target.value.trim().toLowerCase();
          if (clearSearchBtn) clearSearchBtn.classList.toggle('hidden', val.length === 0);

          if (val.length < 1) {
            searchResults.classList.add('hidden');
            return;
          }

          const matches = geoData.filter(f => {
            const name = (f.properties.NAME || f.properties.name || f.properties.ADMIN || '').toLowerCase();
            return name.includes(val);
          }).slice(0, 8);

          if (matches.length > 0) {
            searchResults.innerHTML = matches.map(f => {
              const name = f.properties.NAME || f.properties.name || f.properties.ADMIN;
              return `<div class="px-3 py-2 hover:bg-amber-500/20 text-xs text-slate-200 cursor-pointer flex items-center space-x-2 transition" data-name="${name}">
                <i class="fa-solid fa-location-dot text-amber-400 text-[10px]"></i>
                <span>${name}</span>
              </div>`;
            }).join('');
            searchResults.classList.remove('hidden');

            searchResults.querySelectorAll('[data-name]').forEach(item => {
              item.addEventListener('click', () => {
                const countryName = item.getAttribute('data-name');
                const matchedFeature = geoData.find(f => (f.properties.NAME || f.properties.name || f.properties.ADMIN) === countryName);
                if (matchedFeature) {
                  selectCountryAndRotate(matchedFeature, true);
                  searchInput.value = countryName;
                  searchResults.classList.add('hidden');
                }
              });
            });
          } else {
            searchResults.classList.add('hidden');
          }
        });

        if (clearSearchBtn) {
          clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchResults.classList.add('hidden');
            clearSearchBtn.classList.add('hidden');
          });
        }
      }

      window.addEventListener('resize', () => {
        if (worldGlobe) {
          worldGlobe.width(globeDiv.clientWidth);
          worldGlobe.height(globeDiv.clientHeight);
        }
      });
    }

    window.onload = initApp;
  </script>
</body>
</html>

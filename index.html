              if (wrongGuesses.has(d)) return 'rgba(239, 68, 68, 0.85)';
              if (gameOver && d === targetCountryFeature) return 'rgba(16, 185, 129, 0.95)';
              return 'rgba(30, 41, 59, 0.85)';
            }

            if (gameMode === 'hotcold') {
              if (hotColdMap.has(d)) return hotColdMap.get(d).rgba;
              if (d === selectedFeature) return 'rgba(245, 158, 11, 0.95)';
              if (gameOver && d === targetCountryFeature) return 'rgba(16, 185, 129, 0.95)';
              return 'rgba(30, 41, 59, 0.85)';
            }

            // Guesser mode default
            if (d === selectedFeature) return 'rgba(245, 158, 11, 0.95)';
            if (wrongGuesses.has(d)) return 'rgba(239, 68, 68, 0.85)';
            if (gameOver && d === targetCountryFeature) return 'rgba(16, 185, 129, 0.95)';
            return 'rgba(30, 41, 59, 0.85)';
          })
          .polygonSideColor(() => 'rgba(15, 23, 42, 0.7)')
          .polygonStrokeColor(d => {
            if (d.properties && (d.properties.isGuessCircle || d.properties.isTargetCircle)) return '#ffffff';
            if (d === selectedFeature) return '#f59e0b';
            if (gameMode === 'timezoner' && d === timeZonerTarget) return '#22d3ee';
            if (gameMode === 'higherlower') {
              if (d === higherLowerCountryA) return '#f59e0b';
              if (d === higherLowerCountryB) return '#22d3ee';
            }
            if (gameMode === 'countrylink') {
              if (d === countryLinkStart) return '#10b981';
              if (d === countryLinkEnd) return '#f59e0b';
              if (countryLinkPath.includes(d)) return '#22d3ee';
            }
            return 'rgba(255, 255, 255, 0.2)';
          })
          .polygonAltitude(d => {
            if (d.properties && d.properties.isGuessCircle) return 0.025;
            if (d.properties && d.properties.isTargetCircle) return 0.03;
            if (gameMode === 'timezoner' && d === timeZonerTarget) return 0.035;
            if (gameMode === 'higherlower') {
              if (d === higherLowerCountryA || d === higherLowerCountryB) return 0.035;
              return 0.008;
            }
            if (gameMode === 'countrylink') {
              if (d === countryLinkStart || d === countryLinkEnd) return 0.03;
              if (countryLinkPath.includes(d)) return 0.02;
              if (d === selectedFeature) return 0.025;
              return 0.008;
            }
            if (d === selectedFeature) return 0.03;
            if (gameOver && d === targetCountryFeature) return 0.035;
            if (gameMode === 'hotcold' && hotColdMap.has(d)) return 0.02;
            return 0.008;
          })
          .onPolygonClick((feature, event, coords) => {
            if (gameOver) return;

            if (gameMode === 'speedstate') {
              if (speedStatePhase === 'playing' && !gameOver && feature) {
                selectCountryAndRotate(feature, false);
              }
              return;
            }

            if (gameMode === 'impact') {
              if (!gameOver && coords && !isDraggingImpactRadius) {
                sounds.playSelect();
                impactGuessLoc = { lat: coords.lat, lng: coords.lng };
                worldGlobe.polygonsData(getPolygonsForCurrentMode());

                const nameEl = document.getElementById('selected-country-name');
                if (nameEl) nameEl.textContent = `Impact Center (${coords.lat.toFixed(2)} deg, ${coords.lng.toFixed(2)} deg)`;

                const lockBox = document.getElementById('lock-container');

                }

                renderImpactSidebar();
              }
              return;
            }

            if (feature) selectCountryAndRotate(feature, false);
          })
          .onGlobeClick((coords) => {
            if (gameMode === 'impact' && !gameOver && coords) {
              if (!isDraggingImpactRadius) {
                sounds.playSelect();
                impactGuessLoc = { lat: coords.lat, lng: coords.lng };
                worldGlobe.polygonsData(getPolygonsForCurrentMode());

                const nameEl = document.getElementById('selected-country-name');
                if (nameEl) nameEl.textContent = `Impact Center (${coords.lat.toFixed(2)} deg, ${coords.lng.toFixed(2)} deg)`;

                const lockBox = document.getElementById('lock-container');
                const btnLock = document.getElementById('btn-lock-guess');
                if (lockBox) {
                  lockBox.style.display = 'flex';
                  lockBox.classList.remove('hidden', 'scale-75', 'opacity-0');
                  lockBox.classList.add('scale-100', 'opacity-100');
                  if (btnLock) btnLock.style.pointerEvents = 'auto';
                }
              }
            }
          });

        const btnLock = document.getElementById('btn-lock-guess');
        if (btnLock) {
          btnLock.addEventListener('click', () => {
            if (gameOver) return;

            if (gameMode === 'countrylink') {
              if (!selectedFeature || !countryLinkCurrentTip) return;

              const selIso = getCountryIso3(selectedFeature);
              const tipIso = getCountryIso3(countryLinkCurrentTip);
              const endIso = getCountryIso3(countryLinkEnd);
              const selName = getFeatureName(selectedFeature);
              const tipName = getFeatureName(countryLinkCurrentTip);

              if (countryLinkPath.includes(selectedFeature)) {
                showFeedbackToast(`<i class="fa-solid fa-circle-exclamation text-amber-400 mr-1"></i> ${selName} is already in your chain!`, 'wrong');
                return;
              }

              const neighbors = adjacencyGraph.get(tipIso) || new Set();
              const isNeighbor = neighbors.has(selIso);

              if (!isNeighbor) {
                sounds.playWrong();
                showFeedbackToast(`<i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> ${selName} does NOT border ${tipName}!`, 'wrong');
                return;
              }

              sounds.playLockIn();
              countryLinkPath.push(selectedFeature);
              countryLinkCurrentTip = selectedFeature;
              selectedFeature = null;

              const lockBox = document.getElementById('lock-container');
              if (lockBox) {
                lockBox.style.display = 'none';
                lockBox.classList.remove('scale-100', 'opacity-100');
                lockBox.classList.add('hidden', 'scale-75', 'opacity-0');

                const movesTaken = countryLinkPath.length - 1;
                const scoreDiff = movesTaken - countryLinkPar;
                let parText = "On Par!";
                if (scoreDiff < 0) parText = `${Math.abs(scoreDiff)} Under Par! Amazing!`;
                else if (scoreDiff > 0) parText = `+${scoreDiff} Over Par!`;

                  winTextContainer.innerHTML = `<span><i class="fa-solid fa-link text-emerald-400 mr-1"></i> Chain Complete! <strong>${movesTaken} Moves</strong> (Par ${countryLinkPar}) &bull; ${parText}</span>`;

                renderCountryLinkSidebar();

            }

            if (gameMode === 'dontapply') {

              const meta = extractCountryMeta(selectedFeature);

              if (isValid) {
                sounds.playWin();
                dontApplySuccessSet.add(selectedFeature);
                dontApplyRoundIndex++;
                selectedFeature = null;

                const lockBox = document.getElementById('lock-container');
                if (lockBox) {
                  lockBox.style.display = 'none';
                  lockBox.classList.remove('scale-100', 'opacity-100');
                  lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
                }

                if (dontApplyRoundIndex >= 5) {
                  gameOver = true;
                  gameWon = true;
                  if (window.confetti) confetti({ particleCount: 110, spread: 70, origin: { y: 0.6 } });

                  showFeedbackToast(`<i class="fa-solid fa-trophy text-pink-400 mr-1"></i> Outstanding! You completed all 5 rounds!`, 'win');

                  const winTextContainer = document.getElementById('win-text-container');
                  if (winTextContainer) {
                    winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-pink-300 border border-pink-500/50 shadow-2xl flex items-center space-x-2";
                    winTextContainer.innerHTML = `<span><i class="fa-solid fa-ban text-pink-400 mr-1"></i> Application Mastered! 5 / 5 Rounds Completed!</span>`;
                  }

                  renderDontApplySidebar();
                  revealPlayAnother();
                  worldGlobe.polygonsData(getPolygonsForCurrentMode());
                } else {
                  showFeedbackToast(`<i class="fa-solid fa-circle-check text-pink-400 mr-1"></i> Correct! ${selName} matches! Round ${dontApplyRoundIndex + 1} starting...`, 'win');
                  
                  const nextRules = DONT_APPLY_RULES.filter(r => r !== dontApplyRule);
                  dontApplyRule = nextRules[Math.floor(Math.random() * nextRules.length)];

                  renderDontApplySidebar();
                  worldGlobe.polygonsData(getPolygonsForCurrentMode());
                }
              } else {
                sounds.playWrong();
                dontApplyWrongSet.add(selectedFeature);

                if (lockBox) {
                  lockBox.style.display = 'none';
                  lockBox.classList.remove('scale-100', 'opacity-100');
                  lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
                }

                if (dontApplyStrikesLeft <= 0) {

                  const winTextContainer = document.getElementById('win-text-container');
                  if (winTextContainer) {
                    winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-red-400 border border-red-500/50 shadow-2xl flex items-center space-x-2";

                  }

                  renderDontApplySidebar();
                  revealPlayAnother();
                  worldGlobe.polygonsData(getPolygonsForCurrentMode());

                  showFeedbackToast(`<i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Strike! ${selName} does NOT apply! (${dontApplyStrikesLeft} strikes left)`, 'wrong');
                  renderDontApplySidebar();
                  worldGlobe.polygonsData(getPolygonsForCurrentMode());
                }
              }
              return;
            }

            if (gameMode === 'speedstate') {
              if (speedStatePhase !== 'playing' || !selectedFeature || !speedStateTarget) return;

              const selName = getFeatureName(selectedFeature);
              const targetName = getFeatureName(speedStateTarget);
              const isCorrect = (selectedFeature === speedStateTarget) || (selName.toLowerCase() === targetName.toLowerCase());

              if (isCorrect) {
                sounds.playSelect();
                speedStateCorrectSet.add(speedStateTarget);

                if (speedStateTimerInterval) clearInterval(speedStateTimerInterval);

                const lockBox = document.getElementById('lock-container');
                if (lockBox) {
                  lockBox.style.display = 'none';
                  lockBox.classList.remove('scale-100', 'opacity-100');
                  lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
                }

                if (speedStateIndex + 1 >= speedStateList.length) {
                  speedStatePhase = 'win';
                  gameOver = true;
                  gameWon = true;
                  sounds.playWin();

                  if (window.confetti) confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });

                  if (winTextContainer) {
                    winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-amber-300 border border-yellow-500/50 shadow-2xl flex items-center space-x-2";

                  revealPlayAnother();
                  worldGlobe.polygonsData(getPolygonsForCurrentMode());

                  speedStateIndex++;
                  speedStateTarget = speedStateList[speedStateIndex];
                  selectedFeature = null;

                  speedStateTimeLimit = Math.max(4.0, Number((20.0 - speedStateIndex * 1.5).toFixed(1)));
                  speedStateTimeRemaining = speedStateTimeLimit;

                  renderSpeedStateSidebar();
                  worldGlobe.polygonsData(getPolygonsForCurrentMode());
                  startSpeedStateTimer();
                }
                return;

              } else {
                sounds.playWrong();
                if (speedStateTimerInterval) clearInterval(speedStateTimerInterval);

                speedStatePhase = 'gameover';
                gameOver = true;
                gameWon = false;

                const lockBox = document.getElementById('lock-container');
                if (lockBox) {
                  lockBox.style.display = 'none';
                  lockBox.classList.remove('scale-100', 'opacity-100');
                  lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
                }

                if (worldGlobe && speedStateTarget) {
                  const center = getFeatureCentroid(speedStateTarget);
                  worldGlobe.pointOfView({ lat: center.lat, lng: center.lng, altitude: 1.5 }, 1000);
                  worldGlobe.polygonsData(getPolygonsForCurrentMode());
                }

                showFeedbackToast(`<i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Wrong Country! You picked ${selName}. Target was <strong>${targetName}</strong>.`, 'wrong');

                const winTextContainer = document.getElementById('win-text-container');
                if (winTextContainer) {
                  winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-red-400 border border-red-500/50 shadow-2xl flex items-center space-x-2";
                  winTextContainer.innerHTML = `<span><i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Incorrect! Score: ${speedStateCorrectSet.size} / 10</span>`;
                }

                renderSpeedStateSidebar();
                revealPlayAnother();
                return;
              }
            }

            if (gameMode === 'impact') {
              if (!impactGuessLoc || !targetMeteor) return;

              gameOver = true;
              gameWon = true;

              const distKm = getDistanceKm(impactGuessLoc.lat, impactGuessLoc.lng, targetMeteor.lat, targetMeteor.lng);
              const radDiffKm = Math.abs(impactGuessRadius - targetMeteor.radius);

              const distScore = Math.max(0, 100 - (distKm / 35));
              const maxRadMargin = Math.max(targetMeteor.radius * 2, 20);
              const radScore = Math.max(0, 100 - (radDiffKm / maxRadMargin) * 100);
              const overallAccuracy = Math.round(distScore * 0.65 + radScore * 0.35);

  <!-- Audio Synthesizer Script -->
  <script>
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }
      playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.1) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }
      playSelect() { this.playTone(520, 'sine', 0.08, 0.08); }
      playLockIn() { this.playTone(330, 'triangle', 0.15, 0.12); }
      playWrong() {
        if (this.muted) return;
        this.playTone(180, 'sawtooth', 0.25, 0.12);
        setTimeout(() => this.playTone(140, 'sawtooth', 0.3, 0.12), 150);
      }
      playWin() {
        if (this.muted) return;
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((n, i) => {
          setTimeout(() => this.playTone(n, 'triangle', 0.3, 0.15), i * 120);
        });
      }
    }
    const sounds = new SoundManager();
  </script>

    // Point-in-polygon land validation helpers
    function isPointInPolygon(pt, ring) {
      let x = pt.lng, y = pt.lat;
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        let xi = ring[i][0], yi = ring[i][1];
        let xj = ring[j][0], yj = ring[j][1];
        let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function isPointInFeature(pt, feature) {
      if (!feature || !feature.geometry) return false;
      const geom = feature.geometry;
      if (geom.type === 'Polygon') {
        return isPointInPolygon(pt, geom.coordinates[0]);
      } else if (geom.type === 'MultiPolygon') {
        for (let poly of geom.coordinates) {
          if (isPointInPolygon(pt, poly[0])) return true;
        }
      }
      return false;
    }

    function isPointOnLand(pt) {
      if (!geoData || !geoData.length) return true;
      for (let i = 0; i < geoData.length; i++) {
        const feature = geoData[i];
        if (feature._bbox) {
          if (pt.lng < feature._bbox[0] || pt.lng > feature._bbox[2] || pt.lat < feature._bbox[1] || pt.lat > feature._bbox[3]) {
            continue;
          }
        }
        if (isPointInFeature(pt, feature)) return true;
      }
      return false;
    }

    // Helper to generate realistic high-density store location dots per chain strictly on land
    function generateChainLocations(hubs, regionalBounds, targetCount = 8000, seed = 101) {
      const points = [];
      let s = seed;
      const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };

      if (!hubs || hubs.length === 0) return points;

      hubs.forEach(h => {
        if (isPointOnLand(h)) {
          points.push({ lat: h.lat, lng: h.lng });
        }
      });

      let maxAttempts = targetCount * 6;
      let attempts = 0;

      while (points.length < targetCount && attempts < maxAttempts) {
        attempts++;
        const r = rnd();
        let cand;

        if (r < 0.65) {
          const hub = hubs[Math.floor(rnd() * hubs.length)];
          const spread = Math.pow(rnd(), 1.8) * (0.05 + rnd() * 4.2);
          const angle = rnd() * Math.PI * 2;
          cand = {
            lat: Number(Math.max(-75, Math.min(75, hub.lat + Math.sin(angle) * spread)).toFixed(4)),
            lng: Number(Math.max(-175, Math.min(175, hub.lng + Math.cos(angle) * spread)).toFixed(4))
          };
        } else if (r < 0.88 && regionalBounds && regionalBounds.length > 0) {
          const b = regionalBounds[Math.floor(rnd() * regionalBounds.length)];
          cand = {
            lat: Number((b.minLat + rnd() * (b.maxLat - b.minLat)).toFixed(4)),
            lng: Number((b.minLng + rnd() * (b.maxLng - b.minLng)).toFixed(4))
          };
        } else {
          if (points.length > 0) {
            const basePt = points[Math.floor(rnd() * points.length)];
            const spread = 0.04 + rnd() * 0.75;
            const angle = rnd() * Math.PI * 2;
            cand = {
              lat: Number(Math.max(-75, Math.min(75, basePt.lat + Math.sin(angle) * spread)).toFixed(4)),
              lng: Number(Math.max(-175, Math.min(175, basePt.lng + Math.cos(angle) * spread)).toFixed(4))
            };
          } else {
            const hub = hubs[Math.floor(rnd() * hubs.length)];
            cand = { lat: hub.lat, lng: hub.lng };
          }
        }

        if (cand && isPointOnLand(cand)) {
          points.push(cand);
        }
      }

      return points;
    }

    function createGeodesicCircle(centerLat, centerLng, radiusKm, numPoints = 64) {
      if (isNaN(centerLat) || isNaN(centerLng) || isNaN(radiusKm)) {
        return { type: "Feature", properties: { isCircle: true }, geometry: { type: "Polygon", coordinates: [[]] } };
      }
      const safeLat = Math.max(-85, Math.min(85, centerLat));
      const safeLng = Math.max(-180, Math.min(180, centerLng));
      const safeRadius = Math.max(0.1, Math.min(300, radiusKm));

      const points = [];
      const R = 6371;
      const radLat = safeLat * Math.PI / 180;
      const radLng = safeLng * Math.PI / 180;
      const d = safeRadius / R;

      for (let i = 0; i < numPoints; i++) {
        const bearing = (i * 2 * Math.PI) / numPoints;
        const ptLat = Math.asin(
          Math.sin(radLat) * Math.cos(d) +
          Math.cos(radLat) * Math.sin(d) * Math.cos(bearing)
        );
        const ptLng = radLng + Math.atan2(
          Math.sin(bearing) * Math.sin(d) * Math.cos(radLat),
          Math.cos(d) - Math.sin(radLat) * Math.sin(ptLat)
        );

        const degLat = ptLat * 180 / Math.PI;
        let degLng = ptLng * 180 / Math.PI;

        while (degLng > 180) degLng -= 360;
        while (degLng < -180) degLng += 360;

        points.push([degLng, degLat]);
      }

      points.push([points[0][0], points[0][1]]);

      return {
        type: "Feature",
        properties: { isCircle: true },
        geometry: {
          type: "Polygon",
          coordinates: [points]
        }
      };
    }

    function getPolygonsForCurrentMode() {
      if (gameMode === 'impact') {
        const list = [...geoData];
        if (impactGuessLoc) {
          const guessCircle = createGeodesicCircle(impactGuessLoc.lat, impactGuessLoc.lng, impactGuessRadius, 64);
          guessCircle.properties.isGuessCircle = true;
          list.push(guessCircle);
        }
        if (gameOver && targetMeteor) {
          const targetCircle = createGeodesicCircle(targetMeteor.lat, targetMeteor.lng, targetMeteor.radius, 64);
          targetCircle.properties.isTargetCircle = true;
          list.push(targetCircle);
        }
        return list;
      }
      return geoData;
    }

    function updateImpactRadius(newRadius) {
      if (typeof newRadius !== 'number' || isNaN(newRadius)) return;
      impactGuessRadius = Math.max(0.1, Math.min(300, newRadius));
      const textEl = document.getElementById('radius-display-text');
      if (textEl) {
        textEl.innerHTML = `${impactGuessRadius.toFixed(1)} km <span class="text-[10px] text-slate-400">(${(impactGuessRadius * 0.621371).toFixed(1)} mi)</span>`;
      }
      const sliderEl = document.getElementById('impact-radius-slider');
      if (sliderEl) {
        sliderEl.value = impactGuessRadius;
      }
      if (worldGlobe) {
        worldGlobe.polygonsData(getPolygonsForCurrentMode());
      }
    }

    function adjustImpactRadius(delta) { updateImpactRadius(impactGuessRadius + delta); }

    function getTriviaQuestionsForCountry(feature) {
      const meta = extractCountryMeta(feature);
      const iso3 = getCountryIso3(feature);

      let questions = [];

      if (CURATED_TRIVIA_DATABASE[iso3] && CURATED_TRIVIA_DATABASE[iso3].length >= 4) {
        questions = [...CURATED_TRIVIA_DATABASE[iso3]];
      }

      const fallbackQuestions = [
        `Which country's official capital city is ${meta.capital}?`,
        `Which nation located in ${meta.continent} (${meta.subregion}) uses the internet domain extension '${meta.tld}'?`,
        `Which country drives on the ${meta.drive} side of the road and is located in the ${meta.hemisphere} hemisphere?`,
        `Which country features ${meta.mainColor} on its flag and has a name length of ${meta.nameLength} letters?`
      ];

      for (let fq of fallbackQuestions) {
        if (questions.length < 4 && !questions.includes(fq)) {
          questions.push(fq);
        }
      }

      return questions.map(qText => ({
        questionText: qText,
        feature: feature,
        meta: meta
      }));
    }

    function getFeatureName(feature) {
      if (!feature || !feature.properties) return "Unknown";
      const p = feature.properties;
      return p.NAME || p.name || p.ADMIN || p.SOVEREIGNT || p.NAME_LONG || p.STATE_NAME || "Unknown";
    }

    function getPopTier(pop) {
      if (!pop) return "< 10M";
      if (pop > 500000000) return "> 500M";
      if (pop > 100000000) return "100M - 500M";
      if (pop > 50000000) return "50M - 100M";
      if (pop > 10000000) return "10M - 50M";
      return "< 10M";
    }

    function getFeatureCentroid(feature) {
      if (!feature || !feature.geometry) return { lat: 20, lng: 0 };
      
      let polygons = [];
      const geom = feature.geometry;
      if (geom.type === 'Polygon') polygons = [geom.coordinates];
      else if (geom.type === 'MultiPolygon') polygons = geom.coordinates;

      if (polygons.length === 0) return { lat: 20, lng: 0 };

      // Select largest polygon by vertex count to target mainland centroid
      let mainPoly = polygons[0];
      let maxVerts = 0;
      polygons.forEach(p => {
        let count = 0;
        p.forEach(r => count += r.length);
        if (count > maxVerts) {
          maxVerts = count;
          mainPoly = p;
        }
      });

      let totalX = 0, totalY = 0, count = 0;
      mainPoly.forEach(ring => {
        ring.forEach(pt => {
          totalX += pt[0];
          totalY += pt[1];
          count++;
        });
      });

      if (count === 0) return { lat: 20, lng: 0 };
      return { lat: totalY / count, lng: totalX / count };
    }

    function getFeatureBounds(feature) {
      if (!feature || !feature.geometry) return { deltaLat: 30, deltaLng: 30 };
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

      let polygons = [];
      const geom = feature.geometry;
      if (geom.type === 'Polygon') polygons = [geom.coordinates];
      else if (geom.type === 'MultiPolygon') polygons = geom.coordinates;

      let mainPoly = polygons[0];
      let maxVerts = 0;
      polygons.forEach(p => {
        let verts = 0;
        p.forEach(r => verts += r.length);
        if (verts > maxVerts) {
          maxVerts = verts;
          mainPoly = p;
        }
      });

      mainPoly.forEach(ring => {
        ring.forEach(pt => {
          if (pt[0] < minX) minX = pt[0];
          if (pt[0] > maxX) maxX = pt[0];
          if (pt[1] < minY) minY = pt[1];
          if (pt[1] > maxY) maxY = pt[1];
        });
      });

      return {
        deltaLat: Math.max(1, maxY - minY),
        deltaLng: Math.max(1, maxX - minX)
      };
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    function getCountryIso3(feature) {
      if (!feature || !feature.properties) return "UNK";
      const p = feature.properties;
      const candidates = [p.ISO_A3, p.ADM0_A3, p.WB_A3, p.SOV_A3, p.ISO_A3_EH, p.GU_A3];
      for (let c of candidates) {
        if (c && c !== '-99' && c !== 'UNK' && typeof c === 'string' && c.length === 3) {
          return c.toUpperCase();
        }
      }
      return "UNK";
    }

    function getCountryIso2(feature) {
      if (!feature || !feature.properties) return "us";
      const p = feature.properties;
      const cName = getFeatureName(feature);
      const isoFixes = {
        "France": "fr", "Norway": "no", "Somaliland": "so", "Kosovo": "xk", 
        "Northern Cyprus": "cy", "Western Sahara": "eh", "United States of America": "us"
      };
      if (isoFixes[cName]) return isoFixes[cName];
      let iso2 = (p.ISO_A2 || p.iso_a2 || p.POSTAL || p.WB_A2 || "").toLowerCase();
      if (!iso2 || iso2 === '-99' || iso2.length !== 2) {
        const iso3 = getCountryIso3(feature);
        iso2 = iso3.slice(0, 2).toLowerCase();
      }
      return iso2;
    }

    function getCityForCountry(feature) {
      if (!feature) return { name: "Capital City", lat: 0, lng: 0 };
      const p = feature.properties || {};
      const cName = getFeatureName(feature);
      const iso3 = getCountryIso3(feature);
      const iso2 = (p.ISO_A2 || p.iso_a2 || p.POSTAL || p.WB_A2 || "").toUpperCase();

      const candidateKeys = [
        iso3, iso2, cName, p.NAME, p.name, p.ADMIN, p.SOVEREIGNT, p.NAME_LONG, p.STATE_NAME
      ].filter(Boolean);

      for (let key of candidateKeys) {
        const norm = normalizeCountryKey(key);
        if (CITIES_LOOKUP[norm] && CITIES_LOOKUP[norm].length > 0) {
          const list = CITIES_LOOKUP[norm];
          const chosen = list[Math.floor(Math.random() * list.length)];
          return { ...chosen };
        }
      }

      for (let key of candidateKeys) {
        const norm = normalizeCountryKey(key);
        if (CAPITALS_COORDS_LOOKUP[norm]) {
          return { ...CAPITALS_COORDS_LOOKUP[norm] };
        }
      }

      const centroid = getFeatureCentroid(feature);
      let capName = (typeof REAL_CAPITALS_DATABASE !== 'undefined' && (REAL_CAPITALS_DATABASE[iso3] || REAL_CAPITALS_DATABASE[iso2]))
                    || p.CAPITAL || p.CAP_NAME;

      if (!capName || capName.toLowerCase() === cName.toLowerCase() || capName === '-99') {
        capName = `${cName} City`;
      }

      return {
        name: capName,
        lat: Number(centroid.lat.toFixed(4)),
        lng: Number(centroid.lng.toFixed(4))
      };
    }

    function extractCountryMeta(feature) {
      const p = feature ? (feature.properties || {}) : {};
      const cName = getFeatureName(feature);
      const iso3 = getCountryIso3(feature);
      let iso2 = p.ISO_A2 || p.iso_a2 || p.POSTAL || p.WB_A2;
      
      const isoFixes = {
        "France": "FR", "Norway": "NO", "Somaliland": "SO", "Kosovo": "XK", 
        "Northern Cyprus": "CY", "Western Sahara": "EH"
      };
      if (isoFixes[cName]) iso2 = isoFixes[cName];
      if (!iso2 || iso2 === '-99' || iso2.length !== 2) iso2 = iso3.slice(0, 2);

      const fallback = COUNTRY_METADATA_FALLBACK[iso3] || {};
      
      const lat = p.LABEL_Y !== undefined ? p.LABEL_Y : (p.LAT || 0);
      const lon = p.LABEL_X !== undefined ? p.LABEL_X : (p.LON || 0);
      const latText = lat >= 0 ? "Northern" : "Southern";
      const lonText = lon >= 0 ? "Eastern" : "Western";
      const hemi = `${latText} & ${lonText}`;

      const drive = (LEFT_DRIVE_ISO.has(iso2.toUpperCase()) || LEFT_DRIVE_ISO.has(iso3.toUpperCase())) ? "Left" : "Right";
      const tld = "." + iso2.toLowerCase();
      const capDb = (typeof REAL_CAPITALS_DATABASE !== 'undefined') ? REAL_CAPITALS_DATABASE : {};
      const capName = capDb[iso3] || capDb[cName] || p.CAPITAL || p.CAP_NAME || fallback.capital || cName;

      const isLandlocked = LANDLOCKED_ISO.has(iso3.toUpperCase()) || LANDLOCKED_ISO.has(iso2.toUpperCase());
      const coastStatus = isLandlocked ? "Landlocked" : "Coastal";

      const explicitColor = REAL_FLAG_COLORS[iso3] || REAL_FLAG_COLORS[iso2];
      const colorOptions = ["Red", "Blue", "Green", "Yellow", "White"];
      const charSum = cName.split('').reduce((sum, char) => sum + char.charCodeAt(0), 0);
      const fallbackColor = colorOptions[charSum % colorOptions.length];

      return {
        name: cName,
        nameLength: cName.length,
        capital: capName,
        capitalLetter: capName[0].toUpperCase(),
        continent: p.CONTINENT || p.REGION_UN || fallback.continent || "Global",
        subregion: p.SUBREGION || p.REGION_WB || p.CONTINENT || "Global",
        hemisphere: hemi,
        coast: coastStatus,
        popTier: getPopTier(p.POP_EST),
        drive: drive,
        tld: tld,
        mainColor: explicitColor || fallback.mainColor || fallbackColor,
        letter: cName[0].toUpperCase()
      };
    }

    function generateRoundClues(meta) {
      const usedTitles = new Set();

      const tier1Pool = [
        { title: "Driving Side", icon: "fa-car", text: `Drives on: <strong class="text-white">${meta.drive}</strong>` },

      ];

      const tier2Pool = [

        { title: "Name Length", icon: "fa-font", text: `Name: <strong class="text-amber-300">${meta.nameLength} Letters</strong>` }
      ];

      const tier3Pool = [
        { title: "Subregion", icon: "fa-map-location-dot", text: `Subregion: <strong class="text-amber-300">${meta.subregion}</strong>` },
        { title: "Country Initial", icon: "fa-arrow-down-a-z", text: `Country Initial: <strong class="text-amber-400 font-extrabold">'${meta.letter}'</strong>` },
        { title: "Main Flag Color", icon: "fa-palette", text: `A Main Color: <strong class="text-amber-300 font-bold">${meta.mainColor}</strong>` }
      ];

      const tier4Pool = [
        { title: "Continent", icon: "fa-globe", text: `Continent: <strong class="text-white font-bold">${meta.continent}</strong>` },
        { title: "Country Initial", icon: "fa-arrow-down-a-z", text: `Country Initial: <strong class="text-amber-400 font-extrabold">'${meta.letter}'</strong>` },
        { title: "Subregion", icon: "fa-map-location-dot", text: `Subregion: <strong class="text-amber-300">${meta.subregion}</strong>` }
      ];

      const pickUnique = (pool) => {
        const available = pool.filter(c => !usedTitles.has(c.title));
        if (available.length === 0) return null;
        const chosen = available[Math.floor(Math.random() * available.length)];
        usedTitles.add(chosen.title);
        return chosen;
      };

      const clue1 = pickUnique(tier1Pool) || { title: "Driving Side", icon: "fa-car", text: `Drives on: <strong class="text-white">${meta.drive}</strong>` };
      const clue2 = pickUnique(tier2Pool) || { title: "Population", icon: "fa-users", text: `Pop Bracket: <strong class="text-amber-300">${meta.popTier}</strong>` };
      const clue3 = pickUnique(tier3Pool) || { title: "Country Initial", icon: "fa-arrow-down-a-z", text: `Country Initial: <strong class="text-amber-400 font-extrabold">'${meta.letter}'</strong>` };
      const clue4 = pickUnique(tier4Pool) || { title: "Continent", icon: "fa-globe", text: `Continent: <strong class="text-white font-bold">${meta.continent}</strong>` };

      let clue5;
      const includeShape = Math.random() < 0.6;
      if (includeShape && !usedTitles.has("Shape Outline")) {
        clue5 = { title: "Shape Outline", icon: "fa-draw-polygon", isSilhouette: true };
        usedTitles.add("Shape Outline");
      } else {
        const fallbackPool = [
          { title: "Continent", icon: "fa-globe", text: `Continent: <strong class="text-white font-bold">${meta.continent}</strong>` },
          { title: "Country Initial", icon: "fa-arrow-down-a-z", text: `Country Initial: <strong class="text-amber-400 font-extrabold">'${meta.letter}'</strong>` },
          { title: "Subregion", icon: "fa-map-location-dot", text: `Subregion: <strong class="text-amber-300">${meta.subregion}</strong>` }
        ];
        clue5 = pickUnique(fallbackPool) || { title: "Shape Outline", icon: "fa-draw-polygon", isSilhouette: true };
      }

      return [
        { num: 1, ...clue1, slotId: 'clue-slot-1' },
        { num: 2, ...clue2, slotId: 'clue-slot-2' },
        { num: 3, ...clue3, slotId: 'clue-slot-3' },
        { num: 4, ...clue4, slotId: 'clue-slot-4' },
        { num: 5, ...clue5, slotId: 'clue-slot-5' }
      ];
    }

    function drawSilhouette(canvas, feature) {
      if (!canvas || !feature || !feature.geometry) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      let polygons = [];
      const geom = feature.geometry;
      if (geom.type === 'Polygon') polygons = [geom.coordinates];
      else if (geom.type === 'MultiPolygon') polygons = geom.coordinates;
      
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      polygons.forEach(poly => {
        poly[0].forEach(pt => {
          if (pt[0] < minX) minX = pt[0];
          if (pt[0] > maxX) maxX = pt[0];
          if (pt[1] < minY) minY = pt[1];
          if (pt[1] > maxY) maxY = pt[1];
        });
      });
      
      const w = maxX - minX || 1;
      const h = maxY - minY || 1;
      const padding = 6;
      const scale = Math.min((canvas.width - padding * 2) / w, (canvas.height - padding * 2) / h);
      
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      polygons.forEach(poly => {
        poly.forEach(ring => {
          ring.forEach((pt, i) => {
            const x = padding + (pt[0] - minX) * scale;
            const y = canvas.height - (padding + (pt[1] - minY) * scale);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
        });
      });
      ctx.fill();
    }

    function submitChainedGuess(e) {
      if (e) e.preventDefault();
      if (gameOver || gameMode !== 'chained' || !targetChain) return;

      const inputEl = document.getElementById('chained-guess-input');
      if (!inputEl) return;

      const val = inputEl.value.trim();
      if (!val) return;

      const cleanVal = val.toLowerCase().replace(/[^a-z0-9]/g, '');
      const isCorrect = targetChain.aliases.some(alias => alias.toLowerCase().replace(/[^a-z0-9]/g, '') === cleanVal);

      if (isCorrect) {
        sounds.playWin();
        gameOver = true;
        gameWon = true;
        chainedClueIndex = 6;

        if (window.confetti) confetti({ particleCount: 110, spread: 70, origin: { y: 0.6 } });

        showFeedbackToast(`<i class="fa-solid fa-trophy text-amber-400 mr-1"></i> Excellent! It is <strong>${targetChain.name}</strong>!`, 'win');

        const winTextContainer = document.getElementById('win-text-container');
        if (winTextContainer) {
          winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-sky-300 border border-sky-500/50 shadow-2xl flex items-center space-x-2";
          winTextContainer.innerHTML = `<span><i class="fa-solid fa-store text-sky-400 mr-1"></i> Correct! The chain is <strong class="underline font-bold">${targetChain.name}</strong>!</span>`;
        }

        renderChainedSidebar();

        const playAnotherBox = document.getElementById('play-another-container');
        const btnPlayAnother = document.getElementById('btn-play-another');
        if (playAnotherBox && btnPlayAnother) {
          btnPlayAnother.style.pointerEvents = 'none';
          playAnotherBox.style.display = 'flex';
          playAnotherBox.classList.remove('hidden', 'scale-90', 'opacity-0');
          playAnotherBox.classList.add('scale-100', 'opacity-100');
          setTimeout(() => { btnPlayAnother.style.pointerEvents = 'auto'; }, 400);
        }

      } else {
        sounds.playWrong();
        chainedGuesses.push(val);
        chainedGuessesLeft--;

        if (chainedGuessesLeft > 0) {
          chainedClueIndex++;
          showFeedbackToast(`<i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Incorrect! Clue #${chainedClueIndex} unlocked! (${chainedGuessesLeft} tries left)`, 'wrong');
          renderChainedSidebar();
        } else {
          gameOver = true;
          gameWon = false;
          chainedClueIndex = 6;

          showFeedbackToast(`<i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Out of guesses! The mystery chain was <strong>${targetChain.name}</strong>.`, 'wrong');

          const winTextContainer = document.getElementById('win-text-container');
          if (winTextContainer) {
            winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-red-400 border border-red-500/50 shadow-2xl flex items-center space-x-2";
            winTextContainer.innerHTML = `<span><i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Out of guesses! It was <strong class="underline font-bold">${targetChain.name}</strong></span>`;
          }

          renderChainedSidebar();

          const playAnotherBox = document.getElementById('play-another-container');
          const btnPlayAnother = document.getElementById('btn-play-another');
          if (playAnotherBox && btnPlayAnother) {
            btnPlayAnother.style.pointerEvents = 'none';
            playAnotherBox.style.display = 'flex';
            playAnotherBox.classList.remove('hidden', 'scale-90', 'opacity-0');
            playAnotherBox.classList.add('scale-100', 'opacity-100');
            setTimeout(() => { btnPlayAnother.style.pointerEvents = 'auto'; }, 400);
          }
        }
      }
    }

      if (gameMode !== 'speedstate') return;
      speedStatePhase = 'countdown';
      speedStateCountdown = 3;
      renderSpeedStateSidebar();
      sounds.playSelect();

      speedStateCountdownInterval = setInterval(() => {
        speedStateCountdown--;
        if (speedStateCountdown > 0) {
          sounds.playSelect();
          renderSpeedStateSidebar();
        } else {
          clearInterval(speedStateCountdownInterval);
          speedStatePhase = 'playing';
          sounds.playLockIn();
          renderSpeedStateSidebar();
          startSpeedStateTimer();
        }
      }, 1000);
    }
    window.startSpeedStateGame = startSpeedStateGame;

    function startSpeedStateTimer() {
      if (speedStateTimerInterval) clearInterval(speedStateTimerInterval);
      const startTime = Date.now();
      const initialRemaining = speedStateTimeLimit;

      speedStateTimerInterval = setInterval(() => {
        const elapsed = (Date.now() - startTime) / 1000;
        speedStateTimeRemaining = Math.max(0, initialRemaining - elapsed);

        const timerText = document.getElementById('speed-timer-text');
        const timerBar = document.getElementById('speed-timer-bar');

        if (timerText) {
          timerText.textContent = `${speedStateTimeRemaining.toFixed(1)}s`;
          if (speedStateTimeRemaining <= 3) {
            timerText.className = "font-mono font-bold text-red-400 animate-pulse";
          } else {
            timerText.className = "font-mono font-bold text-amber-300";
          }
        }
        if (timerBar) {
          const pct = Math.max(0, (speedStateTimeRemaining / speedStateTimeLimit) * 100);
          timerBar.style.width = `${pct}%`;
          if (speedStateTimeRemaining <= 3) {
            timerBar.className = "h-full transition-all duration-100 bg-red-500";
          } else {
            timerBar.className = "h-full transition-all duration-100 bg-gradient-to-r from-amber-500 to-yellow-400";
          }
        }

        if (speedStateTimeRemaining <= 0) {
          clearInterval(speedStateTimerInterval);
          sounds.playWrong();
          speedStatePhase = 'gameover';
          gameOver = true;
          gameWon = false;

          const lockBox = document.getElementById('lock-container');
          if (lockBox) {
            lockBox.style.display = 'none';
            lockBox.classList.remove('scale-100', 'opacity-100');
            lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
          }

          if (worldGlobe && speedStateTarget) {
            const center = getFeatureCentroid(speedStateTarget);
            worldGlobe.pointOfView({ lat: center.lat, lng: center.lng, altitude: 1.5 }, 1000);
            worldGlobe.polygonsData(getPolygonsForCurrentMode());
          }

          showFeedbackToast(`<i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Time's up! Target was <strong>${getFeatureName(speedStateTarget)}</strong>.`, 'wrong');

          const winTextContainer = document.getElementById('win-text-container');
          if (winTextContainer) {
            winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-red-400 border border-red-500/50 shadow-2xl flex items-center space-x-2";
            winTextContainer.innerHTML = `<span><i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Time Expired! Score: ${speedStateCorrectSet.size} / 10</span>`;

          renderSpeedStateSidebar();

      const inputEl = document.getElementById('search-country-input');
      const strikeEl = document.getElementById('search-speed-strike');
      const resultsEl = document.getElementById('search-results');
      const clearBtn = document.getElementById('btn-clear-search');

      if (!inputEl) return;

      if (gameMode === 'speedstate') {

        inputEl.classList.add('cursor-not-allowed', 'opacity-50');
        if (resultsEl) resultsEl.classList.add('hidden');
        if (clearBtn) clearBtn.classList.add('hidden');
        inputEl.value = '';
      } else {
        if (strikeEl) strikeEl.classList.add('hidden');
        inputEl.disabled = false;

        inputEl.classList.remove('cursor-not-allowed', 'opacity-50');

    function setupSearchBar() {
      const inputEl = document.getElementById('search-country-input');
      const resultsEl = document.getElementById('search-results');
      const clearBtn = document.getElementById('btn-clear-search');

      if (!inputEl || !resultsEl || !clearBtn) return;

      const handleSearch = () => {
        if (gameMode === 'speedstate') return;

        const query = inputEl.value.trim().toLowerCase();
        if (!query) {
          resultsEl.classList.add('hidden');
          resultsEl.innerHTML = '';
          clearBtn.classList.add('hidden');
          return;
        }

        clearBtn.classList.remove('hidden');

        if (!geoData || geoData.length === 0) return;

        const matches = geoData.filter(f => {
          const name = getFeatureName(f).toLowerCase();
          const p = f.properties || {};
          const altNames = [p.ADMIN, p.SOVEREIGNT, p.NAME_LONG, p.FORMAL_EN].filter(Boolean).map(s => String(s).toLowerCase());
          return name.includes(query) || altNames.some(a => a.includes(query));
        });

        matches.sort((a, b) => {
          const nameA = getFeatureName(a).toLowerCase();
          const nameB = getFeatureName(b).toLowerCase();
          const startsA = nameA.startsWith(query);
          const startsB = nameB.startsWith(query);
          if (startsA && !startsB) return -1;
          if (!startsA && startsB) return 1;
          return nameA.localeCompare(nameB);
        });

        const topResults = matches.slice(0, 10);

        if (topResults.length === 0) {
          resultsEl.innerHTML = `<div class="px-3 py-2 text-xs text-slate-400 italic text-center">No matching countries found</div>`;
          resultsEl.classList.remove('hidden');
          return;
        }

        resultsEl.innerHTML = topResults.map((feat, idx) => {
          const name = getFeatureName(feat);
          const p = feat.properties || {};
          const sub = p.SUBREGION || p.CONTINENT || "World";
          const iso2 = getCountryIso2(feat);
          const flagImgHtml = gameMode !== 'flagged'
            ? `<img src="https://flagcdn.com/w40/${iso2}.png" class="w-4 h-3 object-cover rounded-xs border border-slate-700 shrink-0" onerror="this.onerror=null; this.style.display='none';">`
            : '';
          return `
            <button data-idx="${idx}" class="search-result-item w-full text-left px-3 py-2 hover:bg-slate-800/90 transition flex items-center justify-between group cursor-pointer text-xs">
              <div class="flex items-center space-x-2 truncate">
                ${flagImgHtml}
                <span class="font-bold text-slate-200 group-hover:text-amber-300 transition truncate">${name}</span>
              </div>
              <span class="text-[10px] text-slate-400 shrink-0 ml-2">${sub}</span>
            </button>
          `;
        }).join('');

        resultsEl.classList.remove('hidden');

        const itemBtns = resultsEl.querySelectorAll('.search-result-item');
        itemBtns.forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(btn.getAttribute('data-idx'), 10);
            const feat = topResults[idx];
            if (!feat) return;

            inputEl.value = getFeatureName(feat);
            resultsEl.classList.add('hidden');

            if (worldGlobe) {
              const center = getFeatureCentroid(feat);
              worldGlobe.pointOfView({ lat: center.lat, lng: center.lng, altitude: 1.8 }, 1200);
            }

            if (!gameOver && ['guesser', 'hotcold', 'trivia', 'speedstate', 'flagged'].includes(gameMode)) {
              selectCountryAndRotate(feat, true);
            }
          });
        });
      };

      inputEl.addEventListener('input', handleSearch);
      inputEl.addEventListener('focus', () => {
        if (inputEl.value.trim()) handleSearch();
      });

      clearBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        inputEl.value = '';
        resultsEl.classList.add('hidden');
        resultsEl.innerHTML = '';
        clearBtn.classList.add('hidden');
        inputEl.focus();
      });

      document.addEventListener('click', (e) => {
        if (!inputEl.contains(e.target) && !resultsEl.contains(e.target)) {
          resultsEl.classList.add('hidden');
        }
      });
    }

    function setupImpactEdgeDrag() {
      const container = document.getElementById('globe-container');
      if (!container) return;

      const getPointerGlobeCoords = (e) => {
        const rect = container.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
        if (worldGlobe && typeof worldGlobe.toGlobeCoordinates === 'function') {
          return worldGlobe.toGlobeCoordinates(clientX - rect.left, clientY - rect.top);
        }
        return null;
      };

      const onPointerDown = (e) => {
        if (gameMode !== 'impact' || gameOver || !impactGuessLoc) return;

        const coords = getPointerGlobeCoords(e);
        if (!coords || isNaN(coords.lat) || isNaN(coords.lng)) return;

        const distToCenter = getDistanceKm(coords.lat, coords.lng, impactGuessLoc.lat, impactGuessLoc.lng);
        const edgeTolerance = Math.max(30, impactGuessRadius * 0.35);

        if (Math.abs(distToCenter - impactGuessRadius) <= edgeTolerance) {
          isDraggingImpactRadius = true;
          if (worldGlobe.controls()) worldGlobe.controls().enabled = false;

          const onPointerMove = (moveEv) => {
            if (!isDraggingImpactRadius) return;
            const moveCoords = getPointerGlobeCoords(moveEv);
            if (moveCoords && !isNaN(moveCoords.lat) && !isNaN(moveCoords.lng)) {
              const newDist = getDistanceKm(moveCoords.lat, moveCoords.lng, impactGuessLoc.lat, impactGuessLoc.lng);
              if (!isNaN(newDist)) {
                const clampedRadius = Math.max(0.1, Math.min(300, Math.round(newDist * 10) / 10));
                updateImpactRadius(clampedRadius);
              }
            }
          };

          const onPointerUp = () => {
            isDraggingImpactRadius = false;
            if (worldGlobe.controls()) worldGlobe.controls().enabled = true;
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);
            window.removeEventListener('touchmove', onPointerMove);
            window.removeEventListener('touchend', onPointerUp);
          };

          window.addEventListener('pointermove', onPointerMove);
          window.addEventListener('pointerup', onPointerUp);
          window.addEventListener('touchmove', onPointerMove, { passive: false });
          window.addEventListener('touchend', onPointerUp);

          e.stopPropagation();
        }
      };

      container.addEventListener('pointerdown', onPointerDown);
    }

    async function ensureGlobeLoaded() {
      const getGlobe = () => {
        if (typeof Globe === 'function') return Globe;
        if (typeof window.Globe === 'function') return window.Globe;
        if (window.Globe && typeof window.Globe.default === 'function') return window.Globe.default;
        if (typeof window.GlobeGl === 'function') return window.GlobeGl;
        return null;
      };

      const existing = getGlobe();
      if (existing) return existing;

      const cdns = [
        'https://unpkg.com/globe.gl@2.30.0/dist/globe.gl.min.js',
        'https://cdn.jsdelivr.net/npm/globe.gl@2.30.0/dist/globe.gl.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/globe.gl/2.30.0/globe.gl.min.js'
      ];

      for (const src of cdns) {
        try {
          await new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = src;
            script.crossOrigin = 'anonymous';
            script.onload = () => {
              if (getGlobe()) resolve();
              else reject(new Error('Globe object not found on window after script load'));
            };
            script.onerror = reject;
            document.head.appendChild(script);
          });
          const g = getGlobe();
          if (g) return g;
        } catch(e) {
          console.warn('Failed loading Globe.gl from CDN:', src, e);
        }
      }
      throw new Error('Globe.gl library could not be loaded.');
    }

    async function fetchGeoJson() {
      const urls = [
        'https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson',
        'https://cdn.jsdelivr.net/gh/vasturiano/globe.gl/example/datasets/ne_110m_admin_0_countries.geojson'
      ];

      for (const url of urls) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (data && data.features) {
              return data.features;
            }
          }
        } catch(e) {}
      }
      throw new Error('Could not fetch country GeoJSON dataset.');
    }

    async function initApp() {
      const globeDiv = document.getElementById('globe-container');

      try {
        const GlobeConstructor = await ensureGlobeLoaded();
        const countryFeatures = await fetchGeoJson();

        geoData = countryFeatures.filter(f => f.properties && f.properties.NAME !== 'Antarctica');

        geoData.forEach(f => {
          let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
          const processPoly = (poly) => {
            poly[0].forEach(pt => {
              if (pt[0] < minX) minX = pt[0];
              if (pt[0] > maxX) maxX = pt[0];
              if (pt[1] < minY) minY = pt[1];
              if (pt[1] > maxY) maxY = pt[1];
            });
          };
          if (f.geometry.type === 'Polygon') processPoly(f.geometry.coordinates);
          else if (f.geometry.type === 'MultiPolygon') f.geometry.coordinates.forEach(processPoly);
          f._bbox = [minX, minY, maxX, maxY];
        });

        const getDimensions = () => {
          const rect = globeDiv.getBoundingClientRect();
          return {
            w: rect.width || globeDiv.clientWidth || window.innerWidth,
            h: rect.height || globeDiv.clientHeight || window.innerHeight
          };
        };
        const { w, h } = getDimensions();

        const oceanTexture = (() => {
          const canvas = document.createElement('canvas');
          canvas.width = 1024;
          canvas.height = 512;
          const ctx = canvas.getContext('2d');
          const grad = ctx.createLinearGradient(0, 0, 0, 512);
          grad.addColorStop(0, '#090d16');
          grad.addColorStop(0.5, '#111827');
          grad.addColorStop(1, '#090d16');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 1024, 512);
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.15)';
          ctx.lineWidth = 1;
          for (let x = 0; x < 1024; x += 64) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
          }
          for (let y = 0; y < 512; y += 64) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
          }
          return canvas.toDataURL();
        })();

        worldGlobe = GlobeConstructor()(globeDiv)
          .width(w)
          .height(h)
          .globeImageUrl(oceanTexture)
          .backgroundColor('rgba(0,0,0,0)')
          .showAtmosphere(true)
          .atmosphereColor('#38bdf8')
          .atmosphereAltitude(0.22)
          .polygonsData(getPolygonsForCurrentMode())
          .polygonCapColor(d => {
            if (d.properties && d.properties.isGuessCircle) return 'rgba(156, 163, 175, 0.45)';
            if (d.properties && d.properties.isTargetCircle) return 'rgba(16, 185, 129, 0.55)';

            if (gameMode === 'impact' || gameMode === 'chained') return 'rgba(30, 41, 59, 0.85)';

            if (gameMode === 'flagged') {
              if (gameOver && d === targetCountryFeature) return gameWon ? 'rgba(16, 185, 129, 0.95)' : 'rgba(59, 130, 246, 0.95)';
              if (d === selectedFeature) return 'rgba(245, 158, 11, 0.95)';
              if (wrongGuesses.has(d)) return 'rgba(239, 68, 68, 0.85)';
              return 'rgba(30, 41, 59, 0.85)';
            }

            if (gameMode === 'speedstate') {
              if (speedStateCorrectSet.has(d)) return 'rgba(16, 185, 129, 0.95)';
              if (gameOver && d === speedStateTarget) return 'rgba(239, 68, 68, 0.95)';
              if (d === selectedFeature) return 'rgba(245, 158, 11, 0.95)';
              return 'rgba(30, 41, 59, 0.85)';
            }

            if (gameOver && d === targetCountryFeature) {
              return gameWon ? 'rgba(16, 185, 129, 0.95)' : 'rgba(59, 130, 246, 0.95)';
            }
            if (gameOver && cascadingRedSet.has(d)) return 'rgba(239, 68, 68, 0.9)';
            if (d === selectedFeature) return 'rgba(245, 158, 11, 0.95)';

            if (gameMode === 'trivia') {
              if (triviaWrongAttemptsThisQuestion.has(d)) return 'rgba(239, 68, 68, 0.85)';
              return 'rgba(30, 41, 59, 0.85)';
            }

            if (gameMode === 'hotcold') {
              if (hotColdMap.has(d)) {
                return hotColdMap.get(d).rgba;
              }
            } else {
              if (wrongGuesses.has(d)) return 'rgba(239, 68, 68, 0.85)';
            }
            return 'rgba(30, 41, 59, 0.85)';
          })
          .polygonSideColor(d => {
            if (d.properties && (d.properties.isGuessCircle || d.properties.isTargetCircle)) return 'rgba(255, 255, 255, 0.2)';
            return 'rgba(15, 23, 42, 0.7)';
          })
          .polygonStrokeColor(d => {
            if (d.properties && d.properties.isGuessCircle) return 'rgba(229, 231, 235, 0.95)';
            if (d.properties && d.properties.isTargetCircle) return 'rgba(52, 211, 153, 0.95)';
            return 'rgba(148, 163, 184, 0.45)';
          })
          .polygonAltitude(d => {
            if (d.properties && d.properties.isGuessCircle) return 0.025;
            if (d.properties && d.properties.isTargetCircle) return 0.03;
            if (gameMode === 'speedstate') {
              if (speedStateCorrectSet.has(d)) return 0.015;
              if (d === selectedFeature) return 0.025;
              if (gameOver && d === speedStateTarget) return 0.035;
              return 0.008;
            }
            if (gameMode === 'chained') return 0.008;
            if (gameMode === 'impact') return 0.008;
            if (d === selectedFeature) return 0.03;
            if (gameOver && d === targetCountryFeature) return 0.035;
            if (gameMode === 'hotcold' && hotColdMap.has(d)) return 0.02;
            return 0.008;
          })
          .htmlElementsData([])
          .htmlLat(d => d.lat)
          .htmlLng(d => d.lng)
          .htmlAltitude(d => d.altitude !== undefined ? d.altitude : 0.0082)
          .htmlElement(d => {
            const el = document.createElement('div');
            el.setAttribute('style', 'pointer-events: none !important; transform: translate(0, -50%); display: flex; justify-content: center;');
            el.innerHTML = d.html;
            return el;
          })
          .customLayerData([])
          .customThreeObject(d => d.threeObj)
          .pointsData([])
          .pointLat(d => d.lat)
          .pointLng(d => d.lng)
          .pointColor(() => '#dc2626')
          .pointRadius(0.14)
          .pointAltitude(0.018)
          .onPolygonClick((feature, event, coords) => {
            if (gameMode === 'chained') return;
            if (gameMode === 'speedstate') {
              if (speedStatePhase === 'playing' && !gameOver && feature) {
                selectCountryAndRotate(feature, false);
              }
              return;
            }

            if (gameMode === 'impact') {
              if (!gameOver && coords && !isDraggingImpactRadius) {
                sounds.playSelect();
                impactGuessLoc = { lat: coords.lat, lng: coords.lng };
                worldGlobe.polygonsData(getPolygonsForCurrentMode());

                const nameEl = document.getElementById('selected-country-name');
                if (nameEl) nameEl.textContent = `Impact Center (${coords.lat.toFixed(2)} deg, ${coords.lng.toFixed(2)} deg)`;

                const lockBox = document.getElementById('lock-container');
                const btnLock = document.getElementById('btn-lock-guess');
                if (lockBox) {
                  lockBox.style.display = 'flex';
                  lockBox.classList.remove('hidden', 'scale-75', 'opacity-0');
                  lockBox.classList.add('scale-100', 'opacity-100');
                  if (btnLock) btnLock.style.pointerEvents = 'auto';
                }

                renderImpactSidebar();
              }
              return;
            }

            if (feature) selectCountryAndRotate(feature, false);
          })
          .onGlobeClick((coords) => {
            if (gameMode === 'impact' && !gameOver && coords) {
              if (!isDraggingImpactRadius) {
                sounds.playSelect();
                impactGuessLoc = { lat: coords.lat, lng: coords.lng };
                worldGlobe.polygonsData(getPolygonsForCurrentMode());

                const nameEl = document.getElementById('selected-country-name');
                if (nameEl) nameEl.textContent = `Impact Center (${coords.lat.toFixed(2)} deg, ${coords.lng.toFixed(2)} deg)`;

                const lockBox = document.getElementById('lock-container');
                const btnLock = document.getElementById('btn-lock-guess');
                if (lockBox) {
                  lockBox.style.display = 'flex';
                  lockBox.classList.remove('hidden', 'scale-75', 'opacity-0');
                  lockBox.classList.add('scale-100', 'opacity-100');
                  if (btnLock) btnLock.style.pointerEvents = 'auto';
                }

                renderImpactSidebar();
              }
              return;
            }
          });

        worldGlobe.controls().autoRotate = false;
        worldGlobe.controls().enableZoom = true;
        worldGlobe.pointOfView({ lat: 20, lng: 0, altitude: 2.2 });

        setupImpactEdgeDrag();
        setupSearchBar();

        const resizeGlobe = () => {
          if (worldGlobe && globeDiv) {
            const dims = getDimensions();
            if (dims.w > 0 && dims.h > 0) {
              worldGlobe.width(dims.w);
              worldGlobe.height(dims.h);
            }
          }
        };

        if (window.ResizeObserver) {
          const ro = new ResizeObserver(() => resizeGlobe());
          ro.observe(globeDiv);
        }

        setTimeout(resizeGlobe, 100);
        setTimeout(resizeGlobe, 500);

        const loader = document.getElementById('loader');
        if (loader) {
          loader.style.display = 'none';
          loader.style.pointerEvents = 'none';
          loader.classList.add('hidden');
        }

        startNewRound();
      } catch(err) {
        console.error("Failed to initialize GeoSphere globe", err);
        const loader = document.getElementById('loader');
        if (loader) {
          loader.style.display = 'flex';
          loader.innerHTML = `
            <div class="text-red-400 font-bold">Failed to load world map data.</div>
            <button onclick="location.reload()" class="px-4 py-2 bg-slate-800 text-white text-xs rounded-xl mt-3 border border-slate-700 hover:bg-slate-700">Retry</button>
          `;
        }
      }

      const btnPlayAnother = document.getElementById('btn-play-another');
      if (btnPlayAnother) {
        btnPlayAnother.addEventListener('click', (e) => {
          if (e) e.stopPropagation();
          sounds.playSelect();
          startNewRound();
        });
      }

      const btnLock = document.getElementById('btn-lock-guess');
      if (btnLock) {
        btnLock.addEventListener('click', (e) => {
          if (e) e.stopPropagation();
          if (gameOver) return;

          const revealPlayAnother = () => {
            const playAnotherBox = document.getElementById('play-another-container');
            const btnPlayAnother = document.getElementById('btn-play-another');
            if (playAnotherBox && btnPlayAnother) {
              btnPlayAnother.style.pointerEvents = 'none';
              playAnotherBox.style.display = 'flex';
              playAnotherBox.style.pointerEvents = 'auto';
              playAnotherBox.classList.remove('hidden', 'scale-90', 'opacity-0');
              playAnotherBox.classList.add('scale-100', 'opacity-100');
              setTimeout(() => {
                btnPlayAnother.style.pointerEvents = 'auto';
              }, 400);
            }
          };

          if (gameMode === 'speedstate') {
            if (speedStatePhase !== 'playing' || !selectedFeature || !speedStateTarget) return;

            const selName = getFeatureName(selectedFeature);
            const targetName = getFeatureName(speedStateTarget);
            const isCorrect = (selectedFeature === speedStateTarget) || (selName.toLowerCase() === targetName.toLowerCase());

            if (isCorrect) {
              sounds.playSelect();
              speedStateCorrectSet.add(speedStateTarget);

              if (speedStateTimerInterval) clearInterval(speedStateTimerInterval);

              const lockBox = document.getElementById('lock-container');
              if (lockBox) {
                lockBox.style.display = 'none';
                lockBox.classList.remove('scale-100', 'opacity-100');
                lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
              }

              if (speedStateIndex + 1 >= speedStateList.length) {
                speedStatePhase = 'win';
                gameOver = true;
                gameWon = true;
                sounds.playWin();

                if (window.confetti) confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });

                const winTextContainer = document.getElementById('win-text-container');
                if (winTextContainer) {
                  winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-amber-300 border border-yellow-500/50 shadow-2xl flex items-center space-x-2";
                  winTextContainer.innerHTML = `<span><i class="fa-solid fa-trophy text-amber-400 mr-1"></i> Perfect! All 10 Target Countries Found!</span>`;
                }

                renderSpeedStateSidebar();
                revealPlayAnother();
                worldGlobe.polygonsData(getPolygonsForCurrentMode());
              } else {
                speedStateIndex++;
                speedStateTarget = speedStateList[speedStateIndex];
                selectedFeature = null;

                speedStateTimeLimit = Math.max(4.0, Number((20.0 - speedStateIndex * 1.5).toFixed(1)));
                speedStateTimeRemaining = speedStateTimeLimit;

                renderSpeedStateSidebar();
                worldGlobe.polygonsData(getPolygonsForCurrentMode());
                startSpeedStateTimer();
              }
              return;

            } else {
              sounds.playWrong();
              if (speedStateTimerInterval) clearInterval(speedStateTimerInterval);

              speedStatePhase = 'gameover';
              gameOver = true;
              gameWon = false;

              const lockBox = document.getElementById('lock-container');
              if (lockBox) {
                lockBox.style.display = 'none';
                lockBox.classList.remove('scale-100', 'opacity-100');
                lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
              }

              if (worldGlobe && speedStateTarget) {
                const center = getFeatureCentroid(speedStateTarget);
                worldGlobe.pointOfView({ lat: center.lat, lng: center.lng, altitude: 1.5 }, 1000);
                worldGlobe.polygonsData(getPolygonsForCurrentMode());
              }

              showFeedbackToast(`<i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Wrong Country! You picked ${selName}. Target was <strong>${targetName}</strong>.`, 'wrong');

              const winTextContainer = document.getElementById('win-text-container');
              if (winTextContainer) {
                winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-red-400 border border-red-500/50 shadow-2xl flex items-center space-x-2";
                winTextContainer.innerHTML = `<span><i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Incorrect! Score: ${speedStateCorrectSet.size} / 10</span>`;
              }

              renderSpeedStateSidebar();
              revealPlayAnother();
              return;
            }
          }

          if (gameMode === 'impact') {
            if (!impactGuessLoc || !targetMeteor) return;

            gameOver = true;
            gameWon = true;

            const distKm = getDistanceKm(impactGuessLoc.lat, impactGuessLoc.lng, targetMeteor.lat, targetMeteor.lng);
            const radDiffKm = Math.abs(impactGuessRadius - targetMeteor.radius);

            const distScore = Math.max(0, 100 - (distKm / 35));
            const maxRadMargin = Math.max(targetMeteor.radius * 2, 20);
            const radScore = Math.max(0, 100 - (radDiffKm / maxRadMargin) * 100);
            const overallAccuracy = Math.round(distScore * 0.65 + radScore * 0.35);

            if (overallAccuracy > 70) {
              sounds.playWin();
              if (window.confetti) confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            } else {
              sounds.playLockIn();
            }

            if (worldGlobe) {
              const targetAlt = Math.max(0.12, Math.min(1.2, targetMeteor.radius * 0.012 + 0.18));
              worldGlobe.pointOfView({ lat: targetMeteor.lat, lng: targetMeteor.lng, altitude: targetAlt }, 1600);
              worldGlobe.polygonsData(getPolygonsForCurrentMode());
            }

            const lockBox = document.getElementById('lock-container');
            if (lockBox) {
              lockBox.style.display = 'none';
              lockBox.classList.remove('scale-100', 'opacity-100');
              lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
            }

            const winTextContainer = document.getElementById('win-text-container');
            if (winTextContainer) {
              winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-amber-300 border border-orange-500/50 shadow-2xl flex items-center space-x-2";
              winTextContainer.innerHTML = `<span><i class="fa-solid fa-meteor text-orange-400 mr-1"></i> <strong>${targetMeteor.name}</strong> - ${overallAccuracy}% Accuracy (${distKm.toLocaleString()} km off)!</span>`;
            }

            renderImpactSidebar(distKm, radDiffKm, overallAccuracy);
            revealPlayAnother();
            return;
          }

          if (gameMode === 'flagged') {
            if (!selectedFeature || !targetCountryFeature) return;

            const selName = getFeatureName(selectedFeature);
            const targetName = getFeatureName(targetCountryFeature);
            const isCorrect = (selectedFeature === targetCountryFeature) || 
              (selName !== "Unknown" && targetName !== "Unknown" && selName.toLowerCase() === targetName.toLowerCase());

            const center = getFeatureCentroid(targetCountryFeature);

            if (isCorrect) {
              gameOver = true;
              gameWon = true;
              sounds.playWin();

              if (worldGlobe) {
                worldGlobe.pointOfView({ lat: center.lat, lng: center.lng, altitude: 1.5 }, 1200);
                worldGlobe.polygonsData(getPolygonsForCurrentMode());
              }

              if (window.confetti) confetti({ particleCount: 110, spread: 70, origin: { y: 0.6 } });

              showFeedbackToast(`<i class="fa-solid fa-trophy text-amber-400 mr-1"></i> Correct! That flag belongs to <strong>${targetName}</strong>!`, 'win');

              const winTextContainer = document.getElementById('win-text-container');
              if (winTextContainer) {
                winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-emerald-400 border border-emerald-500/50 shadow-2xl flex items-center space-x-2";
                winTextContainer.innerHTML = `<span><i class="fa-solid fa-flag text-rose-400 mr-1"></i> Correct! It's <strong class="underline font-bold">${targetName}</strong>!</span>`;
              }

              const lockBox = document.getElementById('lock-container');
              if (lockBox) {
                lockBox.style.display = 'none';
                lockBox.classList.remove('scale-100', 'opacity-100');
                lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
              }

              renderFlaggedSidebar();
              revealPlayAnother();
              return;

            } else {
              sounds.playWrong();
              wrongGuesses.add(selectedFeature);
              flaggedGuesses.push(selName);
              flaggedGuessesLeft--;
              selectedFeature = null;

              const lockBox = document.getElementById('lock-container');
              if (lockBox) {
                lockBox.style.display = 'none';
                lockBox.classList.remove('scale-100', 'opacity-100');
                lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
              }

              if (flaggedGuessesLeft > 0) {
                showFeedbackToast(`<i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Incorrect! That flag is not ${selName}. (${flaggedGuessesLeft} tries left)`, 'wrong');
                renderFlaggedSidebar();
                worldGlobe.polygonsData(getPolygonsForCurrentMode());
              } else {
                gameOver = true;
                gameWon = false;

                if (worldGlobe) {
                  worldGlobe.pointOfView({ lat: center.lat, lng: center.lng, altitude: 1.5 }, 1200);
                  worldGlobe.polygonsData(getPolygonsForCurrentMode());
                }

                showFeedbackToast(`<i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Out of tries! This flag belongs to <strong>${targetName}</strong>.`, 'wrong');

                const winTextContainer = document.getElementById('win-text-container');
                if (winTextContainer) {
                  winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-red-400 border border-red-500/50 shadow-2xl flex items-center space-x-2";
                  winTextContainer.innerHTML = `<span><i class="fa-solid fa-flag text-rose-400 mr-1"></i> Out of tries! It was <strong class="underline font-bold">${targetName}</strong></span>`;
                }

                renderFlaggedSidebar();
                revealPlayAnother();
              }
              return;
            }
          }

          if (gameMode === 'trivia') {
            if (!selectedFeature) return;

            const selName = getFeatureName(selectedFeature);
            const targetName = getFeatureName(targetCountryFeature);
            const isCorrect = (selectedFeature === targetCountryFeature) || 
              (selName !== "Unknown" && targetName !== "Unknown" && selName.toLowerCase() === targetName.toLowerCase());

            if (isCorrect) {
              sounds.playWin();
              triviaScore++;
              showFeedbackToast(`<i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i> Correct! ${targetName} is right! (+1 Pt)`, 'win');

              triviaQuestionIndex++;
              triviaAttemptsLeft = 2;
              triviaWrongAttemptsThisQuestion.clear();
              selectedFeature = null;

              const lockBox = document.getElementById('lock-container');
              if (lockBox) {
                lockBox.style.display = 'none';
                lockBox.classList.remove('scale-100', 'opacity-100');
                lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
              }

              if (triviaQuestionIndex >= 4) {
                gameOver = true;
                gameWon = triviaScore > 0;
                
                const winTextContainer = document.getElementById('win-text-container');
                if (winTextContainer) {
                  winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-purple-300 border border-purple-500/50 shadow-2xl flex items-center space-x-2";
                  winTextContainer.innerHTML = `<span><i class="fa-solid fa-brain text-purple-400 mr-1"></i> <strong>Trivia Game Finished!</strong> Score: ${triviaScore} / 4 Correct!</span>`;
                }

                if (window.confetti && triviaScore >= 2) confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                revealPlayAnother();
              } else {
                targetCountryFeature = triviaQuestionsForRound[triviaQuestionIndex].feature;
                targetMeta = extractCountryMeta(targetCountryFeature);
                renderTriviaSidebar();
                worldGlobe.polygonsData(getPolygonsForCurrentMode());
              }
              return;
            } else {
              sounds.playWrong();
              triviaWrongAttemptsThisQuestion.add(selectedFeature);
              triviaAttemptsLeft--;
              selectedFeature = null;

              const lockBox = document.getElementById('lock-container');
              if (lockBox) {
                lockBox.style.display = 'none';
                lockBox.classList.remove('scale-100', 'opacity-100');
                lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
              }

              if (triviaAttemptsLeft > 0) {
                showFeedbackToast(`<i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Incorrect! ${selName} is wrong. 1 attempt remaining!`, 'wrong');
                renderTriviaSidebar();
                worldGlobe.polygonsData(getPolygonsForCurrentMode());
              } else {
                showFeedbackToast(`<i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Out of tries! The correct answer was <strong>${targetName}</strong>.`, 'wrong');
                
                triviaQuestionIndex++;
                triviaAttemptsLeft = 2;
                triviaWrongAttemptsThisQuestion.clear();

                if (triviaQuestionIndex >= 4) {
                  gameOver = true;
                  gameWon = triviaScore > 0;

                  const winTextContainer = document.getElementById('win-text-container');
                  if (winTextContainer) {
                    winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-purple-300 border border-purple-500/50 shadow-2xl flex items-center space-x-2";
                    winTextContainer.innerHTML = `<span><i class="fa-solid fa-brain text-purple-400 mr-1"></i> <strong>Trivia Game Finished!</strong> Score: ${triviaScore} / 4 Correct!</span>`;
                  }

                  revealPlayAnother();
                } else {
                  targetCountryFeature = triviaQuestionsForRound[triviaQuestionIndex].feature;
                  targetMeta = extractCountryMeta(targetCountryFeature);
                  renderTriviaSidebar();
                  worldGlobe.polygonsData(getPolygonsForCurrentMode());
                }
              }
              return;
            }
          }

          if (!selectedFeature) return;

          const selName = getFeatureName(selectedFeature);
          const targetName = getFeatureName(targetCountryFeature);
          const isCorrect = (selectedFeature === targetCountryFeature) || 
            (selName !== "Unknown" && targetName !== "Unknown" && selName.toLowerCase() === targetName.toLowerCase());

          if (isCorrect) {
            gameOver = true;
            gameWon = true;
            sounds.playWin();
            showFeedbackToast(`<i class="fa-solid fa-trophy text-amber-400 mr-1"></i> Correct! ${targetName} is the mystery country!`, 'win');

            if (gameMode === 'guesser') {
              currentClueIndex = 5;
              renderGuesserSidebar();
            } else {
              hotColdGuessesCount++;
              const selCenter = getFeatureCentroid(selectedFeature);
              const targetCenter = getFeatureCentroid(targetCountryFeature);
              const dist = getDistanceKm(selCenter.lat, selCenter.lng, targetCenter.lat, targetCenter.lng);
              const tempInfo = { name: "Correct!", icon: "fa-bullseye", textColor: "text-emerald-400", borderColor: "border-emerald-500/50", rgba: "rgba(16, 185, 129, 0.95)" };
              hotColdMap.set(selectedFeature, tempInfo);
              hotColdHistory.unshift({ name: selName, dist, tempInfo });
              renderHotColdSidebar();
            }

            worldGlobe.polygonsData(getPolygonsForCurrentMode());

            if (window.confetti) {
              confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }

            const lockBox = document.getElementById('lock-container');
            if (lockBox) {
              lockBox.style.display = 'none';
              lockBox.classList.remove('scale-100', 'opacity-100');
              lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
            }

            const winTextContainer = document.getElementById('win-text-container');
            if (winTextContainer) {
              winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-emerald-400 border border-emerald-500/50 shadow-2xl flex items-center space-x-2";
              winTextContainer.innerHTML = `<span><i class="fa-solid fa-trophy text-amber-400 mr-1"></i> Correct! It's <span class="underline font-bold">${targetName}</span>!</span>`;
            }

            revealPlayAnother();

          } else {
            if (gameMode === 'guesser') {
              sounds.playWrong();
              wrongGuesses.add(selectedFeature);
              selectedFeature = null;

              const lockBox = document.getElementById('lock-container');
              if (lockBox) {
                lockBox.style.display = 'none';
                lockBox.classList.remove('scale-100', 'opacity-100');
                lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
              }

              if (currentClueIndex < 5) {
                currentClueIndex++;
                showFeedbackToast(`<i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Incorrect! ${selName} is wrong. Clue #${currentClueIndex} unlocked!`, 'wrong');
                renderGuesserSidebar();
                worldGlobe.polygonsData(getPolygonsForCurrentMode());
              } else {
                gameOver = true;
                gameWon = false;

                if (worldGlobe && targetCountryFeature) {
                  const center = getFeatureCentroid(targetCountryFeature);
                  worldGlobe.pointOfView({ lat: center.lat, lng: center.lng, altitude: 1.6 }, 1200);
                  worldGlobe.polygonsData(getPolygonsForCurrentMode());
                }

                const winTextContainer = document.getElementById('win-text-container');
                if (winTextContainer) {
                  winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-red-400 border border-red-500/50 shadow-2xl flex items-center space-x-2";
                  winTextContainer.innerHTML = `<span><i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Out of clues! It was <span class="underline font-bold">${targetName}</span></span>`;
                }

                revealPlayAnother();
              }
            } else {
              sounds.playLockIn();
              const selCenter = getFeatureCentroid(selectedFeature);
              const targetCenter = getFeatureCentroid(targetCountryFeature);
              const dist = getDistanceKm(selCenter.lat, selCenter.lng, targetCenter.lat, targetCenter.lng);
              const tempInfo = getTemperatureInfo(dist);

              hotColdMap.set(selectedFeature, tempInfo);
              hotColdHistory.unshift({ name: selName, dist, tempInfo });
              hotColdGuessesCount++;

              selectedFeature = null;

              const lockBox = document.getElementById('lock-container');
              if (lockBox) {
                lockBox.style.display = 'none';
                lockBox.classList.remove('scale-100', 'opacity-100');
                lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
              }

              if (hotColdGuessesCount >= MAX_HOTCOLD_GUESSES) {
                gameOver = true;
                gameWon = false;
                sounds.playWrong();
                renderHotColdSidebar();

                if (worldGlobe && targetCountryFeature) {
                  const center = getFeatureCentroid(targetCountryFeature);
                  worldGlobe.pointOfView({ lat: center.lat, lng: center.lng, altitude: 1.6 }, 1200);
                  worldGlobe.polygonsData(getPolygonsForCurrentMode());
                }

                const winTextContainer = document.getElementById('win-text-container');
                if (winTextContainer) {
                  winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-red-400 border border-red-500/50 shadow-2xl flex items-center space-x-2";
                  winTextContainer.innerHTML = `<span><i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Out of 10 guesses! It was <span class="underline font-bold">${targetName}</span></span>`;
                }

                revealPlayAnother();
              } else {
                const toastType = dist < 2500 ? 'hot' : (dist < 5000 ? 'info' : 'cold');
                showFeedbackToast(`<i class="fa-solid ${tempInfo.icon}"></i> ${tempInfo.name}! ${selName} is ${dist.toLocaleString()} km away. (${MAX_HOTCOLD_GUESSES - hotColdGuessesCount} guesses left)`, toastType);
                renderHotColdSidebar();
                worldGlobe.polygonsData(getPolygonsForCurrentMode());
              }
            }
          }
        });
      }

      const modeBtn = document.getElementById('mode-dropdown-btn');
      const modeMenu = document.getElementById('mode-menu');
      const modeBadge = document.getElementById('current-mode-badge');
      const btnGuesser = document.getElementById('mode-guesser');
      const btnHotCold = document.getElementById('mode-hotcold');
      const btnTrivia = document.getElementById('mode-trivia');
      const btnImpact = document.getElementById('mode-impact');
      const btnSpeedState = document.getElementById('mode-speedstate');
      const btnChained = document.getElementById('mode-chained');
      const btnFlagged = document.getElementById('mode-flagged');

      if (modeBtn && modeMenu) {
        modeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          modeMenu.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
          if (!modeBtn.contains(e.target) && !modeMenu.contains(e.target)) {
            modeMenu.classList.add('hidden');
          }
        });

        const resetMenuStyles = () => {
          [btnGuesser, btnHotCold, btnTrivia, btnImpact, btnSpeedState, btnChained, btnFlagged].forEach(btn => {
            if (btn) btn.className = "w-full text-left px-2.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 hover:bg-slate-800/80 transition text-slate-300 mt-1";
          });
        };

        if (btnGuesser && btnHotCold && btnTrivia && btnImpact && btnSpeedState && btnChained && btnFlagged) {
          btnGuesser.addEventListener('click', () => {
            if (gameMode === 'guesser') { modeMenu.classList.add('hidden'); return; }
            gameMode = 'guesser';
            if (modeBadge) modeBadge.textContent = 'Country Guesser';
            resetMenuStyles();
            btnGuesser.className = "w-full text-left px-2.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 hover:bg-slate-800/80 transition text-amber-300 bg-slate-800/50";
            modeMenu.classList.add('hidden');
            startNewRound();
          });

          btnHotCold.addEventListener('click', () => {
            if (gameMode === 'hotcold') { modeMenu.classList.add('hidden'); return; }
            gameMode = 'hotcold';
            if (modeBadge) modeBadge.textContent = 'Hot or Cold';
            resetMenuStyles();
            btnHotCold.className = "w-full text-left px-2.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 hover:bg-slate-800/80 transition text-amber-300 bg-slate-800/50 mt-1";
            modeMenu.classList.add('hidden');
            startNewRound();
          });

          btnTrivia.addEventListener('click', () => {
            if (gameMode === 'trivia') { modeMenu.classList.add('hidden'); return; }
            gameMode = 'trivia';
            if (modeBadge) modeBadge.textContent = 'Trivia Guesser';
            resetMenuStyles();
            btnTrivia.className = "w-full text-left px-2.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 hover:bg-slate-800/80 transition text-purple-300 bg-purple-900/40 mt-1";
            modeMenu.classList.add('hidden');
            startNewRound();
          });

          btnImpact.addEventListener('click', () => {
            if (gameMode === 'impact') { modeMenu.classList.add('hidden'); return; }
            gameMode = 'impact';
            if (modeBadge) modeBadge.textContent = 'Impact Mode';
            resetMenuStyles();
            btnImpact.className = "w-full text-left px-2.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 hover:bg-slate-800/80 transition text-orange-300 bg-orange-950/40 mt-1";
            modeMenu.classList.add('hidden');
            startNewRound();
          });

          btnSpeedState.addEventListener('click', () => {
            if (gameMode === 'speedstate') { modeMenu.classList.add('hidden'); return; }
            gameMode = 'speedstate';
            if (modeBadge) modeBadge.textContent = 'Speed Mode';
            resetMenuStyles();
            btnSpeedState.className = "w-full text-left px-2.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 hover:bg-slate-800/80 transition text-yellow-300 bg-yellow-950/40 mt-1";
            modeMenu.classList.add('hidden');
            startNewRound();
          });

          btnChained.addEventListener('click', () => {
            if (gameMode === 'chained') { modeMenu.classList.add('hidden'); return; }
            gameMode = 'chained';
            remainingChainIndices = [];
            if (modeBadge) modeBadge.textContent = 'Chained';
            resetMenuStyles();
            btnChained.className = "w-full text-left px-2.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 hover:bg-slate-800/80 transition text-sky-300 bg-sky-950/40 mt-1";
            modeMenu.classList.add('hidden');
            startNewRound();
          });

          btnFlagged.addEventListener('click', () => {
            if (gameMode === 'flagged') { modeMenu.classList.add('hidden'); return; }
            gameMode = 'flagged';
            if (modeBadge) modeBadge.textContent = 'Flagged';
            resetMenuStyles();
            btnFlagged.className = "w-full text-left px-2.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 hover:bg-slate-800/80 transition text-emerald-300 bg-emerald-950/40 mt-1";
            modeMenu.classList.add('hidden');
            startNewRound();
          });
        }
      }

      window.addEventListener('resize', () => {
        if (worldGlobe) {
          worldGlobe.width(globeDiv.clientWidth);
          worldGlobe.height(globeDiv.clientHeight);
        }
      });
    }

    window.onload = initApp;
  </script>
</body>
</html>

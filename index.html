  <script>
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }
      playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.1) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }
      playSelect() { this.playTone(520, 'sine', 0.08, 0.08); }
      playLockIn() { this.playTone(330, 'triangle', 0.15, 0.12); }
      playWrong() {
        if (this.muted) return;
        this.playTone(180, 'sawtooth', 0.25, 0.12);
        setTimeout(() => this.playTone(140, 'sawtooth', 0.3, 0.12), 150);
      }
      playWin() {
        if (this.muted) return;
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((n, i) => {
          setTimeout(() => this.playTone(n, 'triangle', 0.3, 0.15), i * 120);
        });
      }
    }
    const sounds = new SoundManager();
  </script>

    function isPointInPolygon(pt, ring) {
      let x = pt.lng, y = pt.lat;
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        let xi = ring[i][0], yi = ring[i][1];
        let xj = ring[j][0], yj = ring[j][1];
        let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function isPointInFeature(pt, feature) {
      if (!feature || !feature.geometry) return false;
      const geom = feature.geometry;
      if (geom.type === 'Polygon') {
        return isPointInPolygon(pt, geom.coordinates[0]);
      } else if (geom.type === 'MultiPolygon') {
        for (let poly of geom.coordinates) {
          if (isPointInPolygon(pt, poly[0])) return true;
        }
      }
      return false;
    }

    function isPointOnLand(pt) {
      if (!geoData || !geoData.length) return true;
      for (let i = 0; i < geoData.length; i++) {
        const feature = geoData[i];
        if (feature._bbox) {
          if (pt.lng < feature._bbox[0] || pt.lng > feature._bbox[2] || pt.lat < feature._bbox[1] || pt.lat > feature._bbox[3]) {
            continue;
          }
        }
        if (isPointInFeature(pt, feature)) return true;
      }
      return false;
    }

    function generateChainLocations(hubs, regionalBounds, targetCount = 8000, seed = 101) {
      const points = [];
      let s = seed;
      const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };

      if (!hubs || hubs.length === 0) return points;

      hubs.forEach(h => {
        if (isPointOnLand(h)) {
          points.push({ lat: h.lat, lng: h.lng });
        }
      });

      let maxAttempts = targetCount * 6;
      let attempts = 0;

      while (points.length < targetCount && attempts < maxAttempts) {
        attempts++;
        const r = rnd();
        let cand;

        if (r < 0.65) {
          const hub = hubs[Math.floor(rnd() * hubs.length)];
          const spread = Math.pow(rnd(), 1.8) * (0.05 + rnd() * 4.2);
          const angle = rnd() * Math.PI * 2;
          cand = {
            lat: Number(Math.max(-75, Math.min(75, hub.lat + Math.sin(angle) * spread)).toFixed(4)),
            lng: Number(Math.max(-175, Math.min(175, hub.lng + Math.cos(angle) * spread)).toFixed(4))
          };
        } else if (r < 0.88 && regionalBounds && regionalBounds.length > 0) {
          const b = regionalBounds[Math.floor(rnd() * regionalBounds.length)];
          cand = {
            lat: Number((b.minLat + rnd() * (b.maxLat - b.minLat)).toFixed(4)),
            lng: Number((b.minLng + rnd() * (b.maxLng - b.minLng)).toFixed(4))
          };
        } else {
          if (points.length > 0) {
            const basePt = points[Math.floor(rnd() * points.length)];
            const spread = 0.04 + rnd() * 0.75;
            const angle = rnd() * Math.PI * 2;
            cand = {
              lat: Number(Math.max(-75, Math.min(75, basePt.lat + Math.sin(angle) * spread)).toFixed(4)),
              lng: Number(Math.max(-175, Math.min(175, basePt.lng + Math.cos(angle) * spread)).toFixed(4))
            };
          } else {
            const hub = hubs[Math.floor(rnd() * hubs.length)];
            cand = { lat: hub.lat, lng: hub.lng };
          }
        }

        if (cand && isPointOnLand(cand)) {
          points.push(cand);
        }
      }

      return points;
    }

    function createGeodesicCircle(centerLat, centerLng, radiusKm, numPoints = 64) {
      if (isNaN(centerLat) || isNaN(centerLng) || isNaN(radiusKm)) {
        return { type: "Feature", properties: { isCircle: true }, geometry: { type: "Polygon", coordinates: [[]] } };
      }
      const safeLat = Math.max(-85, Math.min(85, centerLat));
      const safeLng = Math.max(-180, Math.min(180, centerLng));
      const safeRadius = Math.max(0.1, Math.min(300, radiusKm));

      const points = [];
      const R = 6371;
      const radLat = safeLat * Math.PI / 180;
      const radLng = safeLng * Math.PI / 180;
      const d = safeRadius / R;

      for (let i = 0; i < numPoints; i++) {
        const bearing = (i * 2 * Math.PI) / numPoints;
        const ptLat = Math.asin(
          Math.sin(radLat) * Math.cos(d) +
          Math.cos(radLat) * Math.sin(d) * Math.cos(bearing)
        );
        const ptLng = radLng + Math.atan2(
          Math.sin(bearing) * Math.sin(d) * Math.cos(radLat),
          Math.cos(d) - Math.sin(radLat) * Math.sin(ptLat)
        );

        const degLat = ptLat * 180 / Math.PI;
        let degLng = ptLng * 180 / Math.PI;

        while (degLng > 180) degLng -= 360;
        while (degLng < -180) degLng += 360;

        points.push([degLng, degLat]);
      }

      points.push([points[0][0], points[0][1]]);

      return {
        type: "Feature",
        properties: { isCircle: true },
        geometry: {
          type: "Polygon",
          coordinates: [points]
        }
      };
    }

    function getFeatureCentroid(feature) {
      if (!feature || !feature.geometry) return { lat: 20, lng: 0 };
      
      let polygons = [];
      const geom = feature.geometry;
      if (geom.type === 'Polygon') polygons = [geom.coordinates];
      else if (geom.type === 'MultiPolygon') polygons = geom.coordinates;

      if (polygons.length === 0) return { lat: 20, lng: 0 };

      let mainPoly = polygons[0];
      let maxVerts = 0;
      polygons.forEach(p => {
        let count = 0;
        p.forEach(r => count += r.length);
        if (count > maxVerts) {
          maxVerts = count;
          mainPoly = p;
        }
      });

      let totalX = 0, totalY = 0, count = 0;
      mainPoly.forEach(ring => {
        ring.forEach(pt => {
          totalX += pt[0];
          totalY += pt[1];
          count++;
        });
      });

      if (count === 0) return { lat: 20, lng: 0 };
      return { lat: totalY / count, lng: totalX / count };
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    const COUNTRY_METADATA_FALLBACK = {
      "BRA": { capital: "Brasilia", coast: "Atlantic Coastline", mainColor: "Green" },
      "FRA": { capital: "Paris", coast: "Coastal & Maritime", mainColor: "Blue" },
      "JPN": { capital: "Tokyo", coast: "Island Archipelago", mainColor: "White" },
      "EGY": { capital: "Cairo", coast: "Dual Sea Coastline", mainColor: "Red" },
      "AUS": { capital: "Canberra", coast: "Continental Island", mainColor: "Blue" }
    };

    function getCountryIso3(feature) {
      if (!feature || !feature.properties) return "UNK";
      const p = feature.properties;
      const candidates = [p.ISO_A3, p.ADM0_A3, p.WB_A3, p.SOV_A3, p.ISO_A3_EH, p.GU_A3];
      for (let c of candidates) {
        if (c && c !== '-99' && c !== 'UNK' && typeof c === 'string' && c.length === 3) {
          return c.toUpperCase();
        }
      }
      return "UNK";
    }

    function getCountryIso2(feature) {
      if (!feature || !feature.properties) return "us";
      const p = feature.properties;
      const cName = getFeatureName(feature);
      const isoFixes = {
        "France": "fr", "Norway": "no", "Somaliland": "so", "Kosovo": "xk", 
        "Northern Cyprus": "cy", "Western Sahara": "eh", "United States of America": "us"
      };
      if (isoFixes[cName]) return isoFixes[cName];
      let iso2 = (p.ISO_A2 || p.iso_a2 || p.POSTAL || p.WB_A2 || "").toLowerCase();
      if (!iso2 || iso2 === '-99' || iso2.length !== 2) {
        const iso3 = getCountryIso3(feature);
        iso2 = iso3.slice(0, 2).toLowerCase();
      }
      return iso2;
    }

    function getCountryUtcOffsetStr(feature) {
      const iso3 = getCountryIso3(feature);
      const overrides = {
        "USA": "UTC-5", "CAN": "UTC-5", "MEX": "UTC-6", "BRA": "UTC-3", "ARG": "UTC-3",
        "GBR": "UTC+0", "FRA": "UTC+1", "DEU": "UTC+1", "ITA": "UTC+1", "ESP": "UTC+1",
        "PRT": "UTC+0", "POL": "UTC+1", "NLD": "UTC+1", "BEL": "UTC+1", "CHE": "UTC+1",
        "NOR": "UTC+1", "SWE": "UTC+1", "DNK": "UTC+1", "FIN": "UTC+2", "GRC": "UTC+2",
        "TUR": "UTC+3", "EGY": "UTC+2", "ZAF": "UTC+2", "NGA": "UTC+1", "KEN": "UTC+3",
        "RUS": "UTC+3", "CHN": "UTC+8", "JPN": "UTC+9", "KOR": "UTC+9", "IND": "UTC+5:30",
        "AUS": "UTC+10", "IDN": "UTC+7", "THA": "UTC+7", "VNM": "UTC+7", "PHL": "UTC+8",
        "SAU": "UTC+3", "ARE": "UTC+4", "ISR": "UTC+2", "NZL": "UTC+12", "PAK": "UTC+5"
      };
      if (overrides[iso3]) return overrides[iso3];
      
      const centroid = getFeatureCentroid(feature);
      const hours = Math.round(centroid.lng / 15);
      if (hours === 0) return "UTC+0";
      return hours > 0 ? `UTC+${hours}` : `UTC${hours}`;
    }

    function getCountryStatValue(feature, statKey) {
      if (!feature || !feature.properties) return 0;
      const p = feature.properties;
      const iso3 = getCountryIso3(feature);
      const cName = getFeatureName(feature);
      
      if (statKey === 'area') {
        if (p.AREA_SQKM && p.AREA_SQKM > 0) return p.AREA_SQKM;
        if (p.LABEL_X !== undefined && feature._bbox) {
          const wDeg = Math.abs(feature._bbox[2] - feature._bbox[0]);
          const hDeg = Math.abs(feature._bbox[3] - feature._bbox[1]);
          const approxSqKm = Math.round(wDeg * 111 * hDeg * 111 * 0.45);
          return Math.max(500, approxSqKm);
        }
        return 50000;
      }

      if (statKey === 'pop') {
        const pop = p.POP_EST || p.pop_est || p.POP2020;
        if (pop && pop > 1000) return pop;
        const charSum = cName.split('').reduce((s, c) => s + c.charCodeAt(0), 0);
        return (charSum * 125000) % 80000000 + 1500000;
      }

      if (statKey === 'gdp') {
        let gdp = p.GDP_MD_EST || p.GDP_MD || p.gdp_md;
        if (gdp && gdp > 0) return gdp * 1000000;
        const pop = getCountryStatValue(feature, 'pop');
        const charSum = cName.split('').reduce((s, c) => s + c.charCodeAt(0), 0);
        const perCapita = 2000 + (charSum * 450) % 45000;
        return pop * perCapita;
      }

      if (statKey === 'coast') {
        const isLandlocked = LANDLOCKED_ISO.has(iso3.toUpperCase());
        if (isLandlocked) return 0;
        const charSum = cName.split('').reduce((s, c) => s + c.charCodeAt(0), 0);
        return (charSum * 85) % 18000 + 350;
      }

      return 0;
    }

      { key: 'area', name: 'Land Area', unit: 'sq km', icon: 'fa-map-location-dot', format: (v) => `${v.toLocaleString()} km²` },

    const REAL_FLAG_COLORS = {
      "USA": "Red", "CAN": "Red", "MEX": "Green", "BRA": "Green", "ARG": "Light Blue",
      "COL": "Yellow", "PER": "Red", "CHL": "Red", "FRA": "Blue", "DEU": "Red",
      "ITA": "Green", "ESP": "Yellow", "GBR": "Red", "NLD": "Orange", "BEL": "Black"

    const REAL_CAPITALS_DATABASE = {
      "USA": "Washington, D.C.", "CAN": "Ottawa", "MEX": "Mexico City", "BRA": "Brasilia",
      "FRA": "Paris", "DEU": "Berlin", "ITA": "Rome", "ESP": "Madrid", "GBR": "London",

    function extractCountryMeta(feature) {
      const p = feature ? (feature.properties || {}) : {};
      const cName = getFeatureName(feature);
      const iso3 = getCountryIso3(feature);
      let iso2 = p.ISO_A2 || p.iso_a2 || p.POSTAL || p.WB_A2;
      
      if (!iso2 || iso2 === '-99' || iso2.length !== 2) iso2 = iso3.slice(0, 2);

      const fallback = COUNTRY_METADATA_FALLBACK[iso3] || {};
      
      const lat = p.LABEL_Y !== undefined ? p.LABEL_Y : (p.LAT || 0);
      const lon = p.LABEL_X !== undefined ? p.LABEL_X : (p.LON || 0);
      const latText = lat >= 0 ? "Northern" : "Southern";
      const lonText = lon >= 0 ? "Eastern" : "Western";
      const hemi = `${latText} & ${lonText}`;

      const drive = (LEFT_DRIVE_ISO.has(iso2.toUpperCase()) || LEFT_DRIVE_ISO.has(iso3.toUpperCase())) ? "Left" : "Right";
      const tld = "." + iso2.toLowerCase();
      const capDb = (typeof REAL_CAPITALS_DATABASE !== 'undefined') ? REAL_CAPITALS_DATABASE : {};
      const capName = capDb[iso3] || capDb[cName] || p.CAPITAL || p.CAP_NAME || fallback.capital || cName;

      const isLandlocked = LANDLOCKED_ISO.has(iso3.toUpperCase()) || LANDLOCKED_ISO.has(iso2.toUpperCase());
      const coastStatus = isLandlocked ? "Landlocked" : "Coastal";

      const explicitColor = REAL_FLAG_COLORS[iso3] || REAL_FLAG_COLORS[iso2];
      const colorOptions = ["Red", "Blue", "Green", "Yellow", "White"];
      const charSum = cName.split('').reduce((sum, char) => sum + char.charCodeAt(0), 0);
      const fallbackColor = colorOptions[charSum % colorOptions.length];

      return {
        name: cName,
        nameLength: cName.length,
        capital: capName,
        capitalLetter: capName[0].toUpperCase(),
        continent: p.CONTINENT || p.REGION_UN || fallback.continent || "Global",
        subregion: p.SUBREGION || p.REGION_WB || p.CONTINENT || "Global",
        hemisphere: hemi,
        coast: coastStatus,
        popTier: getPopTier(p.POP_EST),
        drive: drive,
        tld: tld,
        mainColor: explicitColor || fallback.mainColor || fallbackColor,
        letter: cName[0].toUpperCase()
      };
    }

    function buildAdjacencyGraph() {
      adjacencyGraph.clear();
      geoData.forEach(f => adjacencyGraph.set(getCountryIso3(f), new Set()));

      const featurePoints = new Map();
      geoData.forEach(f => {
        const iso = getCountryIso3(f);
        const pts = [];
        const extractPts = (poly) => poly[0].forEach(pt => pts.push(pt));
        if (f.geometry.type === 'Polygon') extractPts(f.geometry.coordinates);
        else if (f.geometry.type === 'MultiPolygon') f.geometry.coordinates.forEach(extractPts);
        featurePoints.set(iso, pts);
      });

      const features = geoData;
      for (let i = 0; i < features.length; i++) {
        const f1 = features[i];
        const iso1 = getCountryIso3(f1);
        const pts1 = featurePoints.get(iso1) || [];
        const bbox1 = f1._bbox;

        for (let j = i + 1; j < features.length; j++) {
          const f2 = features[j];
          const iso2 = getCountryIso3(f2);
          const bbox2 = f2._bbox;

          if (!bbox1 || !bbox2) continue;
          if (bbox1[2] + 0.4 < bbox2[0] || bbox2[2] + 0.4 < bbox1[0] ||
              bbox1[3] + 0.4 < bbox2[1] || bbox2[3] + 0.4 < bbox1[1]) {
            continue;
          }

          const pts2 = featurePoints.get(iso2) || [];
          let isNeighbor = false;

          for (let p1 of pts1) {
            for (let p2 of pts2) {
              const dLng = Math.abs(p1[0] - p2[0]);
              const dLat = Math.abs(p1[1] - p2[1]);
              if (dLng < 0.35 && dLat < 0.35) {
                isNeighbor = true;
                break;
              }
            }
            if (isNeighbor) break;
          }

          if (isNeighbor) {
            if (adjacencyGraph.has(iso1)) adjacencyGraph.get(iso1).add(iso2);
            if (adjacencyGraph.has(iso2)) adjacencyGraph.get(iso2).add(iso1);
          }
        }
      }
    }

    function findShortestPath(startIso, endIso) {
      if (startIso === endIso) return [startIso];
      const queue = [[startIso]];
      const visited = new Set([startIso]);

      while (queue.length > 0) {
        const path = queue.shift();
        const curr = path[path.length - 1];
        const neighbors = adjacencyGraph.get(curr) || new Set();

        for (let nbr of neighbors) {
          if (nbr === endIso) {
            return [...path, nbr];
          }
          if (!visited.has(nbr)) {
            visited.add(nbr);
            queue.push([...path, nbr]);
          }
        }
      }
      return null;
    }

        { title: "Continent", icon: "fa-globe", text: `Continent: <strong class="text-white font-bold">${meta.continent}</strong>` }
      ];

      for (let i = textClues.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [textClues[i], textClues[j]] = [textClues[j], textClues[i]];
      }

      const chosen = textClues.slice(0, 4);

      if (Math.random() < 0.15) {
        chosen.push({ title: "Shape Outline", icon: "fa-draw-polygon", isSilhouette: true });
      } else {
        chosen.push(textClues[4]);

      return chosen.map((clue, idx) => ({

      }));
    }

    function drawSilhouette(canvas, feature) {
      if (!canvas || !feature || !feature.geometry) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      let polygons = [];
      const geom = feature.geometry;
      if (geom.type === 'Polygon') polygons = [geom.coordinates];
      else if (geom.type === 'MultiPolygon') polygons = geom.coordinates;
      
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      polygons.forEach(poly => {
        poly[0].forEach(pt => {
          if (pt[0] < minX) minX = pt[0];
          if (pt[0] > maxX) maxX = pt[0];
          if (pt[1] < minY) minY = pt[1];
          if (pt[1] > maxY) maxY = pt[1];
        });
      });
      
      const w = maxX - minX || 1;
      const h = maxY - minY || 1;
      const padding = 6;
      const scale = Math.min((canvas.width - padding * 2) / w, (canvas.height - padding * 2) / h);
      
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      polygons.forEach(poly => {
        poly.forEach(ring => {
          ring.forEach((pt, i) => {
            const x = padding + (pt[0] - minX) * scale;
            const y = canvas.height - (padding + (pt[1] - minY) * scale);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
        });
      });
      ctx.fill();
    }

    function startSpeedStateGame() {
      if (gameMode !== 'speedstate') return;
      if (speedStateCountdownInterval) clearInterval(speedStateCountdownInterval);
      if (speedStateTimerInterval) clearInterval(speedStateTimerInterval);

      speedStatePhase = 'countdown';
      speedStateCountdown = 3;
      renderSpeedStateSidebar();
      sounds.playSelect();

      speedStateCountdownInterval = setInterval(() => {
        if (gameMode !== 'speedstate') {
          if (speedStateCountdownInterval) clearInterval(speedStateCountdownInterval);
          return;
        }
        speedStateCountdown--;
        if (speedStateCountdown > 0) {
          sounds.playSelect();
          renderSpeedStateSidebar();
        } else {
          clearInterval(speedStateCountdownInterval);
          speedStateCountdownInterval = null;
          speedStatePhase = 'playing';
          sounds.playLockIn();

          renderSpeedStateSidebar();
          startSpeedStateTimer();
        }
      }, 1000);
    }
    window.startSpeedStateGame = startSpeedStateGame;

    function startSpeedStateTimer() {
      if (gameMode !== 'speedstate' || speedStatePhase !== 'playing') return;
      if (speedStateTimerInterval) clearInterval(speedStateTimerInterval);

      const startTime = Date.now();
      const initialTimeLeft = speedStateTimeRemaining;

      speedStateTimerInterval = setInterval(() => {
        if (gameMode !== 'speedstate' || speedStatePhase !== 'playing') {
          if (speedStateTimerInterval) clearInterval(speedStateTimerInterval);
          return;
        }

        const elapsed = (Date.now() - startTime) / 1000;
        speedStateTimeRemaining = Math.max(0, initialTimeLeft - elapsed);

        const timerText = document.getElementById('speed-timer-text');
        const timerBar = document.getElementById('speed-timer-bar');

        if (timerText) {
          timerText.textContent = `${speedStateTimeRemaining.toFixed(1)}s`;
          if (speedStateTimeRemaining <= 3) {
            timerText.className = "font-mono font-bold text-red-400 animate-pulse";
          } else {
            timerText.className = "font-mono font-bold text-amber-300";
          }
        }

        if (timerBar) {
          const pct = Math.max(0, (speedStateTimeRemaining / speedStateTimeLimit) * 100);
          timerBar.style.width = `${pct}%`;
          if (speedStateTimeRemaining <= 3) {
            timerBar.className = "h-full transition-all duration-100 bg-red-500";
          } else {
            timerBar.className = "h-full transition-all duration-100 bg-gradient-to-r from-amber-500 to-yellow-400";
          }
        }

        if (speedStateTimeRemaining <= 0) {
          clearInterval(speedStateTimerInterval);
          speedStateTimerInterval = null;

          speedStatePhase = 'gameover';
          gameOver = true;
          gameWon = false;
          sounds.playWrong();

          const lockBox = document.getElementById('lock-container');
          if (lockBox) {
            lockBox.style.display = 'none';
            lockBox.classList.remove('scale-100', 'opacity-100');
            lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
          }

          if (worldGlobe && speedStateTarget) {
            const center = getFeatureCentroid(speedStateTarget);
            worldGlobe.pointOfView({ lat: center.lat, lng: center.lng, altitude: 1.5 }, 1000);
            worldGlobe.polygonsData(getPolygonsForCurrentMode());
          }

          const targetName = speedStateTarget ? getFeatureName(speedStateTarget) : 'Target';
          showFeedbackToast(`<i class="fa-solid fa-hourglass-end text-red-400 mr-1"></i> Time expired! Target was <strong>${targetName}</strong>.`, 'wrong');

          const winTextContainer = document.getElementById('win-text-container');
          if (winTextContainer) {
            winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-red-400 border border-red-500/50 shadow-2xl flex items-center space-x-2";
            winTextContainer.innerHTML = `<span><i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Time expired! Score: ${speedStateCorrectSet.size} / 10</span>`;
          }

          renderSpeedStateSidebar();
          revealPlayAnother();
        }
      }, 100);
    }

      if (!container) return;

      if (timeZonerPhase === 'ready') {
        container.innerHTML = `
          <div class="glass-card p-3.5 rounded-xl border border-cyan-500/40 text-xs shadow-md animate-fade-in text-center space-y-3 pointer-events-auto">

              <span>Time Zoner</span>

            <div class="text-[11px] text-slate-300 leading-relaxed">

            </div>
            <button id="btn-start-timezoner" onclick="startTimeZonerGame()" class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-cyan-500 to-teal-400 hover:from-cyan-400 hover:to-teal-300 text-slate-950 font-black text-xs uppercase tracking-wider shadow-lg hover:shadow-cyan-500/50 transition transform hover:scale-105 active:scale-95 cursor-pointer flex items-center justify-center space-x-2">
              <i class="fa-solid fa-play"></i>

          </div>

      const targetName = getFeatureName(timeZonerTarget);
      const iso2 = getCountryIso2(timeZonerTarget);

      if (timeZonerPhase === 'countdown') {
        container.innerHTML = `
          <div class="glass-card p-3.5 rounded-xl border border-cyan-500/40 text-xs shadow-md animate-fade-in text-center space-y-3 pointer-events-auto">
            <div class="font-extrabold text-cyan-300 flex items-center justify-center space-x-1.5 text-sm">
              <i class="fa-solid fa-clock text-cyan-400 animate-spin"></i>
              <span>Time Zoner</span>
            </div>
            <div class="text-[11px] text-slate-300">Target Country: <strong class="text-white">${targetName}</strong></div>
            <div class="text-4xl font-black text-cyan-400 font-mono tracking-widest my-2 animate-pulse">
              ${timeZonerCountdown > 0 ? timeZonerCountdown : 'GO!'}
            </div>
            <div class="text-[10px] text-slate-400">Get Ready: 8 Seconds to Answer!</div>
          </div>
        `;

          let btnClass = "bg-slate-900/90 hover:bg-slate-800 border-slate-700/80 text-slate-200 hover:text-white";
          let iconHtml = "";

          if (timeZonerPhase === 'result') {
            if (choice === timeZonerCorrectOffsetStr) {
              btnClass = "bg-emerald-950/80 border-emerald-500 text-emerald-300 font-bold shadow-[0_0_10px_rgba(16,185,129,0.5)]";
              iconHtml = `<i class="fa-solid fa-circle-check text-emerald-400"></i>`;
            } else if (choice === timeZonerSelectedChoice) {
              btnClass = "bg-red-950/80 border-red-500 text-red-300 font-bold line-through";
              iconHtml = `<i class="fa-solid fa-circle-xmark text-red-400"></i>`;
            } else {
              btnClass = "bg-slate-900/50 border-slate-800 text-slate-600 opacity-60";
            }
          }

          return `
            <button 
              onclick="handleTimeZonerChoice('${choice}')" 
              ${timeZonerPhase === 'result' ? 'disabled' : ''} 
              class="w-full py-2 px-3 rounded-xl border text-xs font-mono font-bold flex items-center justify-between transition ${btnClass} cursor-pointer">
              <span>${choice}</span>
              ${iconHtml}
            </button>
          `;
        }).join('');

        container.innerHTML = `
          <div class="glass-card p-3 rounded-xl border border-cyan-500/40 text-xs shadow-md animate-fade-in space-y-2.5 pointer-events-auto">
            <div class="flex items-center justify-between">
              <div class="font-bold text-cyan-300 flex items-center space-x-1.5">
                <i class="fa-solid fa-clock text-cyan-400 text-sm"></i>
                <span>Time Zoner</span>
              </div>
              <span class="px-2 py-0.5 rounded-md bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 text-[10px] font-mono font-bold">
                Q ${timeZonerQuestionIndex + 1} / 5
              </span>
            </div>

            <!-- Country Card -->
            <div class="glass-card p-2.5 rounded-lg border border-cyan-500/30 bg-slate-900/80 flex items-center space-x-2.5">
              <img src="https://flagcdn.com/w40/${iso2}.png" class="w-8 h-6 object-cover rounded border border-slate-700 shrink-0" onerror="this.onerror=null; this.style.display='none';">
              <div class="truncate">
                <div class="text-[9px] uppercase font-bold text-slate-400">Identify Time Zone</div>
                <div class="text-sm font-black text-amber-300 truncate">${targetName}</div>
              </div>
            </div>

            <!-- Timer Bar -->
            <div class="space-y-1">
              <div class="flex items-center justify-between text-[11px]">
                <span class="text-slate-300 flex items-center space-x-1">
                  <i class="fa-solid fa-hourglass-half text-cyan-400"></i>
                  <span>Timer:</span>
                </span>
                <span id="timezoner-timer-text" class="font-mono font-bold ${timeZonerTimeRemaining <= 3 ? 'text-red-400 animate-pulse' : 'text-cyan-300'}">
                  ${timeZonerTimeRemaining.toFixed(1)}s
                </span>
              </div>
              <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden border border-slate-700/60">
                <div id="timezoner-timer-bar" class="h-full transition-all duration-100 ${timeZonerTimeRemaining <= 3 ? 'bg-red-500' : 'bg-gradient-to-r from-cyan-500 to-teal-400'}" style="width: ${Math.max(0, (timeZonerTimeRemaining / timeZonerTimeLimit) * 100)}%"></div>
              </div>
            </div>

            <!-- Choice Options -->
            <div class="grid grid-cols-1 gap-1.5 pt-1">
              ${choiceBtns}
            </div>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="glass-card p-3 rounded-xl border border-cyan-500/40 text-xs shadow-md animate-fade-in space-y-2.5 pointer-events-auto">
            <div class="flex items-center justify-between">
              <div class="font-extrabold text-cyan-300 flex items-center space-x-1.5">
                <i class="fa-solid fa-trophy text-amber-400"></i>
                <span>Time Zoner Complete</span>
              </div>
              <span class="px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 font-mono font-bold text-[10px]">
                Score: ${timeZonerScore} / 5
              </span>
            </div>
            <div class="text-slate-200 text-xs pt-1">
              ${timeZonerScore >= 3 ? 'Great job! You mastered world time zones!' : 'Good effort! Keep practicing to master world time zones.'}
            </div>
          </div>
        `;

    }

    function startTimeZonerGame() {
      if (gameMode !== 'timezoner') return;
      timeZonerQuestionIndex = 0;
      timeZonerScore = 0;
      setupTimeZonerQuestion();
    }
    window.startTimeZonerGame = startTimeZonerGame;

    function setupTimeZonerQuestion() {
      if (gameMode !== 'timezoner') return;
      if (geoData.length === 0) return;
      clearTimeZonerTimers();

      timeZonerTarget = geoData[Math.floor(Math.random() * geoData.length)];
      timeZonerCorrectOffsetStr = getCountryUtcOffsetStr(timeZonerTarget);
      timeZonerSelectedChoice = null;
      timeZonerPhase = 'countdown';
      timeZonerCountdown = 3;

      if (worldGlobe && timeZonerTarget) {
        const center = getFeatureCentroid(timeZonerTarget);
        worldGlobe.pointOfView({ lat: center.lat, lng: center.lng, altitude: 1.6 }, 1000);
        worldGlobe.polygonsData(getPolygonsForCurrentMode());
      }

      renderTimeZonerSidebar();
      sounds.playSelect();

      timeZonerCountdownInterval = setInterval(() => {
        if (gameMode !== 'timezoner') {
          clearTimeZonerTimers();
          return;
        }
        timeZonerCountdown--;
        if (timeZonerCountdown > 0) {
          sounds.playSelect();
          renderTimeZonerSidebar();
        } else {
          clearInterval(timeZonerCountdownInterval);
          timeZonerCountdownInterval = null;
          timeZonerPhase = 'playing';
          sounds.playLockIn();

          const availablePool = [
            "UTC-11", "UTC-10", "UTC-9", "UTC-8", "UTC-7", "UTC-6", "UTC-5", "UTC-4", 
            "UTC-3", "UTC-2", "UTC-1", "UTC+0", "UTC+1", "UTC+2", "UTC+3", "UTC+4", 
            "UTC+5", "UTC+6", "UTC+7", "UTC+8", "UTC+9", "UTC+10", "UTC+11", "UTC+12"
          ].filter(o => o !== timeZonerCorrectOffsetStr);

          const distractors = [...availablePool].sort(() => 0.5 - Math.random()).slice(0, 3);
          timeZonerChoices = [timeZonerCorrectOffsetStr, ...distractors].sort(() => 0.5 - Math.random());

          renderTimeZonerSidebar();
          startTimeZonerTimer();
        }
      }, 1000);
    }

    function startTimeZonerTimer() {
      if (gameMode !== 'timezoner') return;
      if (timeZonerTimerInterval) clearInterval(timeZonerTimerInterval);
      timeZonerTimeLimit = 8.0;
      timeZonerTimeRemaining = 8.0;

      const startTime = Date.now();
      timeZonerTimerInterval = setInterval(() => {
        if (gameMode !== 'timezoner') {
          clearTimeZonerTimers();
          return;
        }
        const elapsed = (Date.now() - startTime) / 1000;
        timeZonerTimeRemaining = Math.max(0, 8.0 - elapsed);

        const timerText = document.getElementById('timezoner-timer-text');
        const timerBar = document.getElementById('timezoner-timer-bar');

        if (timerText) {
          timerText.textContent = `${timeZonerTimeRemaining.toFixed(1)}s`;
          if (timeZonerTimeRemaining <= 3) {
            timerText.className = "font-mono font-bold text-red-400 animate-pulse";
          } else {
            timerText.className = "font-mono font-bold text-cyan-300";
          }
        }
        if (timerBar) {
          const pct = Math.max(0, (timeZonerTimeRemaining / timeZonerTimeLimit) * 100);
          timerBar.style.width = `${pct}%`;
          if (timeZonerTimeRemaining <= 3) {
            timerBar.className = "h-full transition-all duration-100 bg-red-500";
          } else {
            timerBar.className = "h-full transition-all duration-100 bg-gradient-to-r from-cyan-500 to-teal-400";
          }
        }

        if (timeZonerTimeRemaining <= 0) {
          clearInterval(timeZonerTimerInterval);
          timeZonerTimerInterval = null;
          sounds.playWrong();
          timeZonerPhase = 'result';
          timeZonerSelectedChoice = null;

          showFeedbackToast(`<i class="fa-solid fa-hourglass-end text-red-400 mr-1"></i> Time's up! ${getFeatureName(timeZonerTarget)} is in <strong>${timeZonerCorrectOffsetStr}</strong>.`, 'wrong');
          renderTimeZonerSidebar();

          timeZonerNextTimeout = setTimeout(advanceTimeZonerNextQuestion, 2000);
        }
      }, 100);
    }

    function handleTimeZonerChoice(chosenUtc) {
      if (gameMode !== 'timezoner' || timeZonerPhase !== 'playing') return;
      clearTimeZonerTimers();

      timeZonerPhase = 'result';
      timeZonerSelectedChoice = chosenUtc;

      const isCorrect = (chosenUtc === timeZonerCorrectOffsetStr);
      const targetName = getFeatureName(timeZonerTarget);

      if (isCorrect) {
        sounds.playWin();
        timeZonerScore++;
        showFeedbackToast(`<i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i> Correct! ${targetName} is in ${timeZonerCorrectOffsetStr}!`, 'win');
      } else {
        sounds.playWrong();
        showFeedbackToast(`<i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Wrong! ${targetName} is in <strong>${timeZonerCorrectOffsetStr}</strong>.`, 'wrong');
      }

      renderTimeZonerSidebar();
      timeZonerNextTimeout = setTimeout(advanceTimeZonerNextQuestion, 1800);
    }
    window.handleTimeZonerChoice = handleTimeZonerChoice;

    function advanceTimeZonerNextQuestion() {
      if (gameMode !== 'timezoner') return;
      timeZonerNextTimeout = null;
      timeZonerQuestionIndex++;
      if (timeZonerQuestionIndex < 5) {
        setupTimeZonerQuestion();
      } else {
        timeZonerPhase = 'gameover';
        gameOver = true;
        gameWon = timeZonerScore >= 3;

        if (gameWon && window.confetti) confetti({ particleCount: 110, spread: 70, origin: { y: 0.6 } });

        const winTextContainer = document.getElementById('win-text-container');
        if (winTextContainer) {
          winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-cyan-300 border border-cyan-500/50 shadow-2xl flex items-center space-x-2";
          winTextContainer.innerHTML = `<span><i class="fa-solid fa-clock text-cyan-400 mr-1"></i> <strong>Time Zoner Round Finished!</strong> Score: ${timeZonerScore} / 5</span>`;
        }

        renderTimeZonerSidebar();
        revealPlayAnother();
      }
    }

    function setupHigherLowerRound() {
      if (geoData.length < 2) return;

      let countryA = geoData[Math.floor(Math.random() * geoData.length)];
      let countryB = geoData[Math.floor(Math.random() * geoData.length)];
      while (countryB === countryA) {
        countryB = geoData[Math.floor(Math.random() * geoData.length)];
      }

      const statObj = STAT_TYPES[Math.floor(Math.random() * STAT_TYPES.length)];

      let valA = getCountryStatValue(countryA, statObj.key);
      let valB = getCountryStatValue(countryB, statObj.key);

      if (valA === valB) valB = Math.round(valA * 1.15) + 10;

      higherLowerCountryA = countryA;
      higherLowerCountryB = countryB;
      higherLowerStatKey = statObj.key;
      higherLowerStatName = statObj.name;
      higherLowerStatValA = valA;
      higherLowerStatValB = valB;
      higherLowerStatUnit = statObj.unit;
      higherLowerPhase = 'playing';
      higherLowerChoice = null;

      if (worldGlobe) {
        const centerA = getFeatureCentroid(countryA);
        worldGlobe.pointOfView({ lat: centerA.lat, lng: centerA.lng, altitude: 2.0 }, 1000);
        worldGlobe.polygonsData(getPolygonsForCurrentMode());
      }

      renderHigherLowerSidebar();
      renderLegend();
    }

    function renderHigherLowerSidebar() {
      const container = document.getElementById('sidebar-container');
      if (!container || !higherLowerCountryA || !higherLowerCountryB) return;

      const nameA = getFeatureName(higherLowerCountryA);
      const nameB = getFeatureName(higherLowerCountryB);
      const isoA2 = getCountryIso2(higherLowerCountryA);
      const isoB2 = getCountryIso2(higherLowerCountryB);

      const statType = STAT_TYPES.find(s => s.key === higherLowerStatKey) || STAT_TYPES[0];
      const formattedValA = statType.format(higherLowerStatValA);
      const formattedValB = statType.format(higherLowerStatValB);

      let cardBHtml = '';
      if (higherLowerPhase === 'playing') {
        cardBHtml = `
          <div class="glass-card p-2.5 rounded-lg border border-cyan-500/40 bg-slate-900/80 space-y-2">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-1.5 truncate">
                <img src="https://flagcdn.com/w40/${isoB2}.png" class="w-5 h-3.5 object-cover rounded border border-slate-700 shrink-0" onerror="this.onerror=null; this.style.display='none';">
                <span class="text-xs font-black text-white truncate">${nameB}</span>
              </div>
              <span class="text-[9px] uppercase font-bold text-cyan-400">Target</span>
            </div>

            <div class="text-[10px] text-slate-300 font-medium text-center leading-tight">
              Does <strong>${nameB}</strong> have a HIGHER or LOWER ${higherLowerStatName}?
            </div>

            <div class="grid grid-cols-2 gap-1.5 pt-1">
              <button onclick="handleHigherLowerChoice('higher')" class="py-2 px-2 rounded-xl bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-black text-xs shadow-lg transition transform hover:scale-105 active:scale-95 flex items-center justify-center space-x-1 cursor-pointer">
                <i class="fa-solid fa-arrow-up text-xs"></i>
                <span>HIGHER</span>
              </button>
              <button onclick="handleHigherLowerChoice('lower')" class="py-2 px-2 rounded-xl bg-gradient-to-r from-rose-600 to-rose-500 hover:from-rose-500 hover:to-rose-400 text-white font-black text-xs shadow-lg transition transform hover:scale-105 active:scale-95 flex items-center justify-center space-x-1 cursor-pointer">
                <i class="fa-solid fa-arrow-down text-xs"></i>
                <span>LOWER</span>
              </button>
            </div>
          </div>
        `;
      } else if (higherLowerPhase === 'result') {
        const isHigher = higherLowerStatValB >= higherLowerStatValA;
        const isCorrect = (higherLowerChoice === 'higher' && isHigher) || (higherLowerChoice === 'lower' && !isHigher);

        const resultBorder = isCorrect ? 'border-emerald-500/80 bg-emerald-950/60 text-emerald-300' : 'border-red-500/80 bg-red-950/60 text-red-300';
        const resultIcon = isCorrect ? 'fa-circle-check text-emerald-400' : 'fa-circle-xmark text-red-400';

        cardBHtml = `
          <div class="glass-card p-2.5 rounded-lg border ${resultBorder} space-y-1.5 animate-fade-in">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-1.5 truncate">
                <img src="https://flagcdn.com/w40/${isoB2}.png" class="w-5 h-3.5 object-cover rounded border border-slate-700 shrink-0" onerror="this.onerror=null; this.style.display='none';">
                <span class="text-xs font-black text-white truncate">${nameB}</span>
              </div>
              <i class="fa-solid ${resultIcon} text-sm"></i>
            </div>
            <div class="text-xs font-extrabold font-mono text-amber-300 text-center py-1 bg-slate-900/80 rounded-md border border-slate-700/60">
              ${formattedValB}
            </div>
            <div class="text-[10px] text-center font-bold">
              ${isCorrect ? 'Correct Prediction!' : 'Incorrect Prediction!'}
            </div>
          </div>
        `;
      }

      if (higherLowerPhase === 'gameover') {
        container.innerHTML = `
          <div class="glass-card p-3 rounded-xl border border-amber-500/40 text-xs shadow-md animate-fade-in space-y-2.5 pointer-events-auto">
            <div class="flex items-center justify-between">
              <div class="font-bold text-amber-300 flex items-center space-x-1.5">
                <i class="fa-solid fa-trophy text-amber-400"></i>
                <span>Higher or Lower Complete</span>
              </div>
              <span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40 font-mono font-bold text-[10px]">
                Score: ${higherLowerScore} / 5
              </span>
            </div>
            <div class="text-slate-200 text-xs pt-1">
              ${higherLowerScore >= 4 ? 'Phenomenal! You have amazing geography stat knowledge!' : 'Good effort! Try again to beat your score!'}
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="glass-card p-3 rounded-xl border border-amber-500/40 text-xs shadow-md animate-fade-in space-y-2.5 pointer-events-auto">
          <div class="flex items-center justify-between">
            <div class="font-bold text-amber-300 flex items-center space-x-1.5">
              <i class="fa-solid fa-scale-unbalanced text-amber-400 text-sm"></i>
              <span>Higher or Lower</span>
            </div>
            <span class="px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[10px] font-mono font-bold">
              Round ${higherLowerRoundIndex + 1} / 5
            </span>
          </div>

          <!-- Stat Category Banner -->
          <div class="glass-card px-2.5 py-1 rounded-lg border border-slate-700/80 bg-slate-900/80 flex items-center justify-between text-[11px]">
            <span class="text-slate-400 font-bold uppercase text-[9px] tracking-wider">Comparing:</span>
            <span class="font-extrabold text-amber-300 flex items-center space-x-1">
              <i class="fa-solid ${statType.icon} text-amber-400"></i>
              <span>${higherLowerStatName}</span>
            </span>
          </div>

          <!-- Base Country A Card -->
          <div class="glass-card p-2.5 rounded-lg border border-amber-500/40 bg-slate-900/80 space-y-1">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-1.5 truncate">
                <img src="https://flagcdn.com/w40/${isoA2}.png" class="w-5 h-3.5 object-cover rounded border border-slate-700 shrink-0" onerror="this.onerror=null; this.style.display='none';">

              </div>
              <span class="text-[9px] uppercase font-bold text-amber-400">Base</span>
            </div>
            <div class="text-xs font-extrabold font-mono text-amber-300 text-center py-1 bg-slate-950/80 rounded-md border border-slate-800">
              ${formattedValA}
            </div>
          </div>

          <!-- Target Country B Card -->
          ${cardBHtml}

          <div class="flex items-center justify-between text-[10px] text-slate-400 pt-0.5">
            <span>Score: <strong class="text-emerald-400 font-mono">${higherLowerScore}</strong> / 5</span>
            <button onclick="focusHigherLowerGlobe()" class="text-slate-400 hover:text-white underline cursor-pointer text-[9px]">
              <i class="fa-solid fa-eye mr-0.5"></i>Focus Country B
            </button>
          </div>
        </div>
      `;
    }

    function handleHigherLowerChoice(userChoice) {
      if (higherLowerPhase !== 'playing') return;

      higherLowerPhase = 'result';
      higherLowerChoice = userChoice;

      const nameA = getFeatureName(higherLowerCountryA);
      const nameB = getFeatureName(higherLowerCountryB);

      const isHigher = higherLowerStatValB >= higherLowerStatValA;
      const isCorrect = (userChoice === 'higher' && isHigher) || (userChoice === 'lower' && !isHigher);

      if (isCorrect) {
        sounds.playWin();
        higherLowerScore++;
        showFeedbackToast(`<i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i> Correct! ${nameB} is indeed ${userChoice.toUpperCase()} than ${nameA}!`, 'win');
      } else {
        sounds.playWrong();
        showFeedbackToast(`<i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Wrong! ${nameB} is ${isHigher ? 'HIGHER' : 'LOWER'} than ${nameA}.`, 'wrong');
      }

      if (worldGlobe && higherLowerCountryB) {
        const centerB = getFeatureCentroid(higherLowerCountryB);
        worldGlobe.pointOfView({ lat: centerB.lat, lng: centerB.lng, altitude: 2.0 }, 1000);
      }

      renderHigherLowerSidebar();

      setTimeout(advanceHigherLowerNextRound, 2200);
    }
    window.handleHigherLowerChoice = handleHigherLowerChoice;

    function focusHigherLowerGlobe() {
      if (worldGlobe && higherLowerCountryB) {
        const centerB = getFeatureCentroid(higherLowerCountryB);
        worldGlobe.pointOfView({ lat: centerB.lat, lng: centerB.lng, altitude: 2.0 }, 1000);
      }
    }
    window.focusHigherLowerGlobe = focusHigherLowerGlobe;

    function advanceHigherLowerNextRound() {
      higherLowerRoundIndex++;
      if (higherLowerRoundIndex < 5) {
        setupHigherLowerRound();
      } else {
        higherLowerPhase = 'gameover';
        gameOver = true;
        gameWon = higherLowerScore >= 3;

        if (gameWon && window.confetti) confetti({ particleCount: 110, spread: 70, origin: { y: 0.6 } });

        const winTextContainer = document.getElementById('win-text-container');
        if (winTextContainer) {
          winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-amber-300 border border-amber-500/50 shadow-2xl flex items-center space-x-2";
          winTextContainer.innerHTML = `<span><i class="fa-solid fa-scale-unbalanced text-amber-400 mr-1"></i> <strong>Higher or Lower Finished!</strong> Score: ${higherLowerScore} / 5</span>`;
        }

        renderHigherLowerSidebar();
        revealPlayAnother();
      }
    }

    function revealPlayAnother() {
      const lockBox = document.getElementById('lock-container');
      if (lockBox) {
        lockBox.style.display = 'none';
        lockBox.classList.remove('scale-100', 'opacity-100');
        lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
      }

    function submitChainedGuess(e) {
      if (e) e.preventDefault();
      if (gameOver || gameMode !== 'chained' || !targetChain) return;

      const inputEl = document.getElementById('chained-guess-input');
      if (!inputEl) return;

      const val = inputEl.value.trim();
      if (!val) return;

      const cleanVal = val.toLowerCase().replace(/[^a-z0-9]/g, '');
      const isCorrect = targetChain.aliases.some(alias => alias.toLowerCase().replace(/[^a-z0-9]/g, '') === cleanVal);

      if (isCorrect) {
        sounds.playWin();
        gameOver = true;
        gameWon = true;
        chainedClueIndex = 6;

        if (window.confetti) confetti({ particleCount: 110, spread: 70, origin: { y: 0.6 } });

        showFeedbackToast(`<i class="fa-solid fa-trophy text-amber-400 mr-1"></i> Excellent! It is <strong>${targetChain.name}</strong>!`, 'win');

        const winTextContainer = document.getElementById('win-text-container');
        if (winTextContainer) {
          winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-sky-300 border border-sky-500/50 shadow-2xl flex items-center space-x-2";
          winTextContainer.innerHTML = `<span><i class="fa-solid fa-store text-sky-400 mr-1"></i> Correct! The chain is <strong class="underline font-bold">${targetChain.name}</strong>!</span>`;
        }

        renderChainedSidebar();
        revealPlayAnother();

      } else {
        sounds.playWrong();
        chainedGuesses.push(val);
        chainedGuessesLeft--;

        if (chainedGuessesLeft > 0) {
          chainedClueIndex++;
          renderChainedSidebar();
          showFeedbackToast(`<i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Incorrect! Clue #${chainedClueIndex} unlocked. (${chainedGuessesLeft} guesses left)`, 'wrong');
        } else {
          gameOver = true;
          gameWon = false;
          showFeedbackToast(`<i class="fa-solid fa-circle-xmark text-red-400 mr-1"></i> Out of guesses! The mystery chain was <strong>${targetChain.name}</strong>.`, 'wrong');

          const winTextContainer = document.getElementById('win-text-container');
          if (winTextContainer) {
            winTextContainer.className = "glass-panel px-4 py-1.5 rounded-full text-xs font-black text-red-400 border border-red-500/50 shadow-2xl flex items-center space-x-2";
            winTextContainer.innerHTML = `<span><i class="fa-solid fa-store text-sky-400 mr-1"></i> Out of guesses! It was <strong class="underline font-bold">${targetChain.name}</strong></span>`;
          }

          renderChainedSidebar();
          revealPlayAnother();
        }
      }

      const inputElClear = document.getElementById('chained-guess-input');
      if (inputElClear) inputElClear.value = '';
    }
    window.submitChainedGuess = submitChainedGuess;

    function startNewRound() {
      if (redCascadeInterval) clearInterval(redCascadeInterval);
      if (speedStateTimerInterval) clearInterval(speedStateTimerInterval);
      if (speedStateCountdownInterval) clearInterval(speedStateCountdownInterval);
      clearTimeZonerTimers();

      updateSearchBarForMode();

      cascadingRedSet.clear();
      wrongGuesses.clear();
      hotColdMap.clear();
      hotColdHistory = [];
      hotColdGuessesCount = 0;
      selectedFeature = null;
      currentClueIndex = 1;
      gameOver = false;
      gameWon = false;

      // Reset Country Link state variables unconditionally on new round / mode change
      countryLinkStart = null;
      countryLinkEnd = null;
      countryLinkPath = [];
      countryLinkPar = 0;
      countryLinkShortestPath = [];
      countryLinkCurrentTip = null;

      timeZonerTarget = null;

      impactGuessLoc = null;
      impactGuessRadius = 25;
      targetMeteor = null;
      isImpactHintRevealed = false;

      targetChain = null;
      chainedGuesses = [];
      chainedGuessesLeft = 6;
      chainedClueIndex = 1;

      if (worldGlobe) {
        worldGlobe.htmlElementsData([]);
        worldGlobe.arcsData([]);
        worldGlobe.pointsData([]);
        worldGlobe.customLayerData([]);
      }

      const lockBox = document.getElementById('lock-container');
      const btnLock = document.getElementById('btn-lock-guess');
      if (lockBox) {
        lockBox.style.display = 'none';
        lockBox.classList.remove('scale-100', 'opacity-100');
        lockBox.classList.add('hidden', 'scale-75', 'opacity-0');
      }
      if (btnLock) {
        btnLock.style.pointerEvents = 'none';
      }

      const playAnotherBox = document.getElementById('play-another-container');
      const btnPlayAnother = document.getElementById('btn-play-another');
      if (playAnotherBox) {
        playAnotherBox.style.display = 'none';
        playAnotherBox.classList.remove('scale-100', 'opacity-100');
        playAnotherBox.classList.add('hidden', 'scale-90', 'opacity-0');
      }
      if (btnPlayAnother) {
        btnPlayAnother.style.pointerEvents = 'none';
      }

      if (gameMode === 'chained') {
        if (!remainingChainIndices || remainingChainIndices.length === 0) {
          remainingChainIndices = CHAINED_DATABASE.map((_, i) => i);
        }
        const randPos = Math.floor(Math.random() * remainingChainIndices.length);
        const chainIdx = remainingChainIndices.splice(randPos, 1)[0];
        targetChain = CHAINED_DATABASE[chainIdx];
        chainedGuessesLeft = 6;
        chainedGuesses = [];
        chainedClueIndex = 1;

        if (targetChain) {
          const points = generateChainLocations(targetChain.hubs, targetChain.regionalBounds, 350, targetChain.seed || 101);
          if (worldGlobe) {
            worldGlobe
              .pointsData(points)
              .pointLat('lat')
              .pointLng('lng')
              .pointColor(() => '#ef4444')
              .pointRadius(0.35)
              .pointAltitude(0.015);

            if (targetChain.hubs && targetChain.hubs.length > 0) {
              const mainHub = targetChain.hubs[0];
              worldGlobe.pointOfView({ lat: mainHub.lat, lng: mainHub.lng, altitude: 2.0 }, 1200);
            }
          }
        }
        renderChainedSidebar();
      } else if (gameMode === 'countrylink') {
        if (geoData.length > 0) {
          if (adjacencyGraph.size === 0) buildAdjacencyGraph();

          let validStart = null;
          let validEnd = null;
          let shortestPath = null;
          let attempts = 0;

          while (attempts < 100) {
            attempts++;
            const randStart = geoData[Math.floor(Math.random() * geoData.length)];
            const startIso = getCountryIso3(randStart);
            const nbrs = adjacencyGraph.get(startIso);

            if (!nbrs || nbrs.size === 0) continue;

            const reachable = [];
            geoData.forEach(cand => {
              const candIso = getCountryIso3(cand);
              if (candIso !== startIso) {
                const path = findShortestPath(startIso, candIso);
                if (path && path.length >= 6 && path.length <= 18) {
                  reachable.push({ feature: cand, path: path });
                }
              }
            });

            if (reachable.length > 0) {
              const chosen = reachable[Math.floor(Math.random() * reachable.length)];
              validStart = randStart;
              validEnd = chosen.feature;
              shortestPath = chosen.path;
              break;
            }
          }

          if (!validStart) {
            validStart = geoData.find(f => getCountryIso3(f) === "ESP") || geoData[0];
            validEnd = geoData.find(f => getCountryIso3(f) === "VNM") || geoData[1];
            shortestPath = findShortestPath(getCountryIso3(validStart), getCountryIso3(validEnd)) || [getCountryIso3(validStart), getCountryIso3(validEnd)];
          }

          countryLinkStart = validStart;
          countryLinkEnd = validEnd;
          countryLinkShortestPath = shortestPath;
          countryLinkPar = Math.max(1, shortestPath.length - 1);
          countryLinkPath = [countryLinkStart];
          countryLinkCurrentTip = countryLinkStart;
        }

        renderCountryLinkSidebar();
      } else if (gameMode === 'flagged') {
        flaggedGuessesLeft = 3;
        flaggedGuesses = [];
        isFlaggedHintRevealed = false;

        if (geoData.length > 0) {
          const randIdx = Math.floor(Math.random() * geoData.length);
          targetCountryFeature = geoData[randIdx];
          targetMeta = extractCountryMeta(targetCountryFeature);
        }

        if (worldGlobe) {
          worldGlobe.htmlElementsData([]);
          worldGlobe.pointsData([]);
        }

        renderFlaggedSidebar();
      } else if (gameMode === 'landmarker') {
        landmarkerGuessesLeft = 3;
        landmarkerGuesses = [];
        isLandmarkerHintRevealed = false;

        const randIdx = Math.floor(Math.random() * LANDMARK_DATABASE.length);
        targetLandmark = LANDMARK_DATABASE[randIdx];

        if (geoData.length > 0) {
          targetCountryFeature = geoData.find(f => {
            const iso3 = getCountryIso3(f);
            const iso2 = getCountryIso2(f).toUpperCase();
            const name = getFeatureName(f).toLowerCase();
            const targetC = targetLandmark.country.toUpperCase();
            return iso3 === targetC || iso2 === targetC || name === targetLandmark.country.toLowerCase();
          }) || null;
          targetMeta = targetCountryFeature ? extractCountryMeta(targetCountryFeature) : null;
        }

        if (worldGlobe) {
          worldGlobe.htmlElementsData([]);
          worldGlobe.pointsData([]);
        }

        renderLandmarkerSidebar();
      } else if (gameMode === 'seconds') {
        secondsGuessesLeft = 3;
        secondsGuesses = [];
        isSecondsHintRevealed = false;

        const randIdx = Math.floor(Math.random() * FOODS_DATABASE.length);
        targetFood = FOODS_DATABASE[randIdx];

        if (geoData.length > 0) {
          targetCountryFeature = geoData.find(f => {
            const iso3 = getCountryIso3(f);
            const iso2 = getCountryIso2(f).toUpperCase();
            const name = getFeatureName(f).toLowerCase();
            const targetC = targetFood.country.toUpperCase();
            return iso3 === targetC || iso2 === targetC || name === targetFood.country.toLowerCase();
          }) || null;
          targetMeta = targetCountryFeature ? extractCountryMeta(targetCountryFeature) : null;
        }

        if (worldGlobe) {
          worldGlobe.htmlElementsData([]);
          worldGlobe.pointsData([]);
        }

        renderSecondsSidebar();
      } else if (gameMode === 'dontapply') {
        dontApplyRoundIndex = 0;
        dontApplyStrikesLeft = 5;
        dontApplyWrongSet.clear();
        dontApplySuccessSet.clear();
        dontApplyRule = DONT_APPLY_RULES[Math.floor(Math.random() * DONT_APPLY_RULES.length)];
        renderDontApplySidebar();
      } else if (gameMode === 'timezoner') {
        timeZonerQuestionIndex = 0;
        timeZonerScore = 0;
        timeZonerPhase = 'ready';
        renderTimeZonerSidebar();
      } else if (gameMode === 'higherlower') {
        higherLowerRoundIndex = 0;
        higherLowerScore = 0;
        setupHigherLowerRound();
      } else if (gameMode === 'impact') {
        if (METEOR_DATABASE.length > 0) {
          targetMeteor = METEOR_DATABASE[Math.floor(Math.random() * METEOR_DATABASE.length)];
        }
        renderImpactSidebar();
      } else if (gameMode === 'speedstate') {
        speedStateIndex = 0;
        speedStateCorrectSet.clear();
        speedStateTimeLimit = 20.0;
        speedStateTimeRemaining = 20.0;
        speedStatePhase = 'ready';

        if (geoData.length > 0) {
          speedStateList = [...geoData].sort(() => 0.5 - Math.random()).slice(0, 10);
          speedStateTarget = speedStateList[0];
        }

        renderSpeedStateSidebar();
      } else if (gameMode === 'trivia') {
        triviaQuestionIndex = 0;
        triviaScore = 0;
        triviaAttemptsLeft = 2;
        triviaWrongAttemptsThisQuestion.clear();
        triviaQuestionsForRound = [];

        if (geoData.length > 0) {
          const shuffled = [...geoData].sort(() => 0.5 - Math.random());
          const chosenFeatures = shuffled.slice(0, 4);

          chosenFeatures.forEach(feat => {
            const qList = getTriviaQuestionsForCountry(feat);
            const chosenQ = qList[Math.floor(Math.random() * qList.length)];
            triviaQuestionsForRound.push(chosenQ);
          });

          targetCountryFeature = triviaQuestionsForRound[0].feature;
          targetMeta = extractCountryMeta(targetCountryFeature);
        }
        renderTriviaSidebar();
      } else {
        if (geoData.length > 0) {
          const randIdx = Math.floor(Math.random() * geoData.length);
          targetCountryFeature = geoData[randIdx];
          targetMeta = extractCountryMeta(targetCountryFeature);
          currentRoundClues = generateRoundClues(targetMeta);
        }

        if (gameMode === 'guesser') {
          renderGuesserSidebar();
        } else if (gameMode === 'hotcold') {
          renderHotColdSidebar();
        }
      }

      renderLegend();

      if (worldGlobe) {
        worldGlobe.polygonsData(getPolygonsForCurrentMode());
        if (gameMode === 'countrylink' && countryLinkStart) {
          const center = getFeatureCentroid(countryLinkStart);
          worldGlobe.pointOfView({ lat: center.lat, lng: center.lng, altitude: 2.0 }, 1200);
        } else {
          worldGlobe.pointOfView({ lat: 20, lng: 0, altitude: 2.2 }, 1200);
        }
      }
    }

    function showFeedbackToast(message, type = 'info') {
      const toast = document.getElementById('feedback-toast');
      const content = document.getElementById('feedback-toast-content');
      if (!toast || !content) return;

      let borderClass = 'border-slate-700';
      let textClass = 'text-white';
      if (type === 'win') {
        borderClass = 'border-emerald-500/80 bg-emerald-950/80';
        textClass = 'text-emerald-300';
      } else if (type === 'wrong') {
        borderClass = 'border-red-500/80 bg-red-950/80';
        textClass = 'text-red-300';
      } else if (type === 'hot') {
        borderClass = 'border-orange-500/80 bg-orange-950/80';
        textClass = 'text-orange-300';
      } else if (type === 'cold') {
        borderClass = 'border-cyan-500/80 bg-cyan-950/80';
        textClass = 'text-cyan-300';
      }

      content.className = `glass-panel px-4 py-2 rounded-full text-xs font-bold shadow-2xl flex items-center space-x-2 border ${borderClass} ${textClass}`;
      content.innerHTML = message;

      toast.style.display = 'flex';
      toast.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      if (toast._timeout) clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-4');
        setTimeout(() => {
          toast.style.display = 'none';
        }, 300);
      }, 3000);
    }

    function updateSearchBarForMode() {
      const inputEl = document.getElementById('search-country-input');
      const strikeEl = document.getElementById('search-speed-strike');
      const resultsEl = document.getElementById('search-results');
      const clearBtn = document.getElementById('btn-clear-search');

      if (!inputEl) return;

      if (gameMode === 'speedstate') {
        if (strikeEl) strikeEl.classList.remove('hidden');
        inputEl.disabled = true;
        inputEl.placeholder = 'Search disabled in Speed Mode';
        inputEl.classList.add('cursor-not-allowed', 'opacity-50');
        if (resultsEl) resultsEl.classList.add('hidden');
        if (clearBtn) clearBtn.classList.add('hidden');
        inputEl.value = '';
      } else {
        if (strikeEl) strikeEl.classList.add('hidden');
        inputEl.disabled = false;
        inputEl.placeholder = 'Search region...';
        inputEl.classList.remove('cursor-not-allowed', 'opacity-50');
      }
    }

    function setupSearchBar() {
      const inputEl = document.getElementById('search-country-input');
      const resultsEl = document.getElementById('search-results');
      const clearBtn = document.getElementById('btn-clear-search');

      if (!inputEl || !resultsEl || !clearBtn) return;

      const handleSearch = () => {
        if (gameMode === 'speedstate') return;

        const query = inputEl.value.trim().toLowerCase();
        if (!query) {
          resultsEl.classList.add('hidden');
          resultsEl.innerHTML = '';
          clearBtn.classList.add('hidden');
          return;
        }

        clearBtn.classList.remove('hidden');

        if (!geoData || geoData.length === 0) return;

        const matches = geoData.filter(f => {
          const name = getFeatureName(f).toLowerCase();
          const p = f.properties || {};
          const altNames = [p.ADMIN, p.SOVEREIGNT, p.NAME_LONG, p.FORMAL_EN].filter(Boolean).map(s => String(s).toLowerCase());
          return name.includes(query) || altNames.some(a => a.includes(query));
        });

        matches.sort((a, b) => {
          const nameA = getFeatureName(a).toLowerCase();
          const nameB = getFeatureName(b).toLowerCase();
          const startsA = nameA.startsWith(query);
          const startsB = nameB.startsWith(query);
          if (startsA && !startsB) return -1;
          if (!startsA && startsB) return 1;
          return nameA.localeCompare(nameB);
        });

        const topResults = matches.slice(0, 10);

        if (topResults.length === 0) {
          resultsEl.innerHTML = `<div class="px-3 py-2 text-xs text-slate-400 italic text-center">No matching countries found</div>`;
          resultsEl.classList.remove('hidden');
          return;
        }

        resultsEl.innerHTML = topResults.map((feat, idx) => {
          const name = getFeatureName(feat);
          const p = feat.properties || {};
          const sub = p.SUBREGION || p.CONTINENT || "World";
          const iso2 = getCountryIso2(feat);
          const flagImgHtml = (gameMode !== 'flagged' && gameMode !== 'dontapply')
            ? `<img src="https://flagcdn.com/w40/${iso2}.png" class="w-4 h-3 object-cover rounded-xs border border-slate-700 shrink-0" onerror="this.onerror=null; this.style.display='none';">`
            : '';
          return `
            <button data-idx="${idx}" class="search-result-item w-full text-left px-3 py-2 hover:bg-slate-800/90 transition flex items-center justify-between group cursor-pointer text-xs">
              <div class="flex items-center space-x-2 truncate">
                ${flagImgHtml}
                <span class="font-bold text-slate-200 group-hover:text-amber-300 transition truncate">${name}</span>
              </div>
              <span class="text-[10px] text-slate-400 shrink-0 ml-2">${sub}</span>
            </button>
          `;
        }).join('');

        resultsEl.classList.remove('hidden');

        const itemBtns = resultsEl.querySelectorAll('.search-result-item');
        itemBtns.forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(btn.getAttribute('data-idx'), 10);
            const feat = topResults[idx];
            if (!feat) return;

            inputEl.value = getFeatureName(feat);
            resultsEl.classList.add('hidden');

            if (worldGlobe) {
              const center = getFeatureCentroid(feat);
              worldGlobe.pointOfView({ lat: center.lat, lng: center.lng, altitude: 1.8 }, 1200);
            }

            if (!gameOver && ['guesser', 'hotcold', 'trivia', 'speedstate', 'flagged', 'dontapply', 'landmarker'].includes(gameMode)) {
              selectCountryAndRotate(feat, true);
            }
          });
        });
      };

      inputEl.addEventListener('input', handleSearch);
      inputEl.addEventListener('focus', handleSearch);

      clearBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        inputEl.value = '';
        resultsEl.classList.add('hidden');
        resultsEl.innerHTML = '';
        clearBtn.classList.add('hidden');
      });

      document.addEventListener('click', (e) => {
        if (!inputEl.contains(e.target) && !resultsEl.contains(e.target)) {
          resultsEl.classList.add('hidden');
        }
      });
    }

    function getPointerGlobeCoords(e) {
      if (!worldGlobe || !worldGlobe.toGlobeCoords) return null;
      const canvas = worldGlobe.container ? worldGlobe.container().querySelector('canvas') : document.querySelector('#globe-container canvas');
      if (!canvas) return null;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      return worldGlobe.toGlobeCoords(x, y);
    }

    function setupImpactEdgeDrag() {
      const container = document.getElementById('globe-container');
      if (!container) return;

      const onPointerDown = (e) => {
        if (gameMode !== 'impact' || gameOver || !impactGuessLoc) return;

        const coords = getPointerGlobeCoords(e);
        if (!coords || isNaN(coords.lat) || isNaN(coords.lng)) return;

        const distToCenter = getDistanceKm(coords.lat, coords.lng, impactGuessLoc.lat, impactGuessLoc.lng);
        const edgeTolerance = Math.max(30, impactGuessRadius * 0.35);

        if (Math.abs(distToCenter - impactGuessRadius) <= edgeTolerance) {
          isDraggingImpactRadius = true;
          if (worldGlobe.controls()) worldGlobe.controls().enabled = false;

          const onPointerMove = (moveEv) => {
            if (!isDraggingImpactRadius) return;
            const moveCoords = getPointerGlobeCoords(moveEv);
            if (moveCoords && !isNaN(moveCoords.lat) && !isNaN(moveCoords.lng)) {
              const newDist = getDistanceKm(moveCoords.lat, moveCoords.lng, impactGuessLoc.lat, impactGuessLoc.lng);
              if (!isNaN(newDist)) {
                const clampedRadius = Math.max(0.1, Math.min(300, Math.round(newDist * 10) / 10));
                updateImpactRadius(clampedRadius);
              }
            }
          };

          const onPointerUp = () => {
            isDraggingImpactRadius = false;
            if (worldGlobe.controls()) worldGlobe.controls().enabled = true;
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);
            window.removeEventListener('touchmove', onPointerMove);
            window.removeEventListener('touchend', onPointerUp);
          };

          window.addEventListener('pointermove', onPointerMove);
          window.addEventListener('pointerup', onPointerUp);
          window.addEventListener('touchmove', onPointerMove, { passive: false });
          window.addEventListener('touchend', onPointerUp);

          e.stopPropagation();
        }
      };

      container.addEventListener('pointerdown', onPointerDown);
    }

    async function ensureGlobeLoaded() {
      const getGlobe = () => {
        if (typeof Globe === 'function') return Globe;
        if (typeof window.Globe === 'function') return window.Globe;
        if (window.Globe && typeof window.Globe.default === 'function') return window.Globe.default;
        if (typeof window.GlobeGl === 'function') return window.GlobeGl;
        return null;
      };

      const existing = getGlobe();
      if (existing) return existing;

      const cdns = [
        'https://unpkg.com/globe.gl@2.30.0/dist/globe.gl.min.js',
        'https://cdn.jsdelivr.net/npm/globe.gl@2.30.0/dist/globe.gl.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/globe.gl/2.30.0/globe.gl.min.js'
      ];

      for (const src of cdns) {
        try {
          await new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = src;
            script.crossOrigin = 'anonymous';
            script.onload = () => {
              if (getGlobe()) resolve();
              else reject(new Error('Globe object not found on window after script load'));
            };
            script.onerror = reject;
            document.head.appendChild(script);
          });
          const g = getGlobe();
          if (g) return g;
        } catch(e) {
          console.warn('Failed loading Globe.gl from CDN:', src, e);
        }
      }
      throw new Error('Globe.gl library could not be loaded.');
    }

    async function fetchGeoJson() {
      const urls = [
        'https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson',
        'https://cdn.jsdelivr.net/gh/vasturiano/globe.gl/example/datasets/ne_110m_admin_0_countries.geojson'
      ];

      for (const url of urls) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (data && data.features) {
              return data.features;
            }
          }
        } catch(e) {}
      }
      throw new Error('Could not fetch country GeoJSON dataset.');
    }

    async function initApp() {
      const globeDiv = document.getElementById('globe-container');

      try {
        const GlobeConstructor = await ensureGlobeLoaded();
        const countryFeatures = await fetchGeoJson();

        geoData = countryFeatures.filter(f => f.properties && f.properties.NAME !== 'Antarctica');

        geoData.forEach(f => {
          let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
          const processPoly = (poly) => {
            poly[0].forEach(pt => {
              if (pt[0] < minX) minX = pt[0];
              if (pt[0] > maxX) maxX = pt[0];
              if (pt[1] < minY) minY = pt[1];
              if (pt[1] > maxY) maxY = pt[1];
            });
          };
          if (f.geometry.type === 'Polygon') processPoly(f.geometry.coordinates);
          else if (f.geometry.type === 'MultiPolygon') f.geometry.coordinates.forEach(processPoly);
          f._bbox = [minX, minY, maxX, maxY];
        });

        const getDimensions = () => {
          const rect = globeDiv.getBoundingClientRect();
          return {
            w: rect.width || globeDiv.clientWidth || window.innerWidth,
            h: rect.height || globeDiv.clientHeight || window.innerHeight
          };
        };
        const { w, h } = getDimensions();

        const oceanTexture = (() => {
          const canvas = document.createElement('canvas');
          canvas.width = 1024;
          canvas.height = 512;
          const ctx = canvas.getContext('2d');
          const grad = ctx.createLinearGradient(0, 0, 0, 512);
          grad.addColorStop(0, '#090d16');
          grad.addColorStop(0.5, '#111827');
          grad.addColorStop(1, '#090d16');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 1024, 512);
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.15)';
          ctx.lineWidth = 1;
          for (let x = 0; x < 1024; x += 64) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
          }
          for (let y = 0; y < 512; y += 64) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
          }
          return canvas.toDataURL();
        })();

        worldGlobe = GlobeConstructor()(globeDiv)
          .width(w)
          .height(h)
          .globeImageUrl(oceanTexture)
          .backgroundColor('rgba(0,0,0,0)')
          .showAtmosphere(true)
          .atmosphereColor('#38bdf8')
          .atmosphereAltitude(0.22)
          .polygonsData(getPolygonsForCurrentMode())
          .polygonCapColor(d => {
            if (d.properties && d.properties.isGuessCircle) return 'rgba(156, 163, 175, 0.45)';
            if (d.properties && d.properties.isTargetCircle) return 'rgba(16, 185, 129, 0.55)';

            if (gameMode === 'impact' || gameMode === 'chained') return 'rgba(30, 41, 59, 0.85)';

            if (gameMode === 'timezoner') {
              if (d === timeZonerTarget) return 'rgba(34, 211, 238, 0.95)';
              return 'rgba(30, 41, 59, 0.85)';
            }

            if (gameMode === 'higherlower') {
              if (d === higherLowerCountryA) return 'rgba(245, 158, 11, 0.95)';
              if (d === higherLowerCountryB) return 'rgba(34, 211, 238, 0.95)';
              return 'rgba(30, 41, 59, 0.85)';
            }

            if (gameMode === 'countrylink') {
              if (d === countryLinkStart) return 'rgba(16, 185, 129, 0.95)';
              if (d === countryLinkEnd) return 'rgba(245, 158, 11, 0.95)';
              if (countryLinkPath.includes(d)) return 'rgba(20, 184, 166, 0.9)';
              if (d === selectedFeature) return 'rgba(99, 102, 241, 0.95)';
              return 'rgba(30, 41, 59, 0.85)';
            }

            if (gameMode === 'dontapply') {
              if (dontApplySuccessSet.has(d)) return 'rgba(236, 72, 153, 0.85)';
              if (dontApplyWrongSet.has(d)) return 'rgba(239, 68, 68, 0.85)';
              if (d === selectedFeature) return 'rgba(245, 158, 11, 0.95)';
              return 'rgba(30, 41, 59, 0.85)';
            }

            if (gameMode === 'speedstate') {
              if (speedStateCorrectSet.has(d)) return 'rgba(16, 185, 129, 0.85)';
              if (d === selectedFeature) return 'rgba(245, 158, 11, 0.95)';
              if (gameOver && d === speedStateTarget) return 'rgba(239, 68, 68, 0.9)';
              return 'rgba(30, 41, 59, 0.85)';
            }

            if (gameMode === 'trivia') {

              return 'rgba(30, 41, 59, 0.85)';
            }

            if (gameMode === 'flagged' || gameMode === 'landmarker' || gameMode === 'seconds') {
